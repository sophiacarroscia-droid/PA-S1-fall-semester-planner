r a ruptured lung abscess, is called a(n):","options":[{"letter":"A","text":"Chylothorax","correct":false,"expl":"A chylothorax is milky lymph from thoracic-duct obstruction."},{"letter":"B","text":"Transudate","correct":false,"expl":"A transudate is clear, low-protein fluid from a pressure imbalance."},{"letter":"C","text":"Hemothorax","correct":false,"expl":"A hemothorax is blood, usually from trauma."},{"letter":"D","text":"Empyema","correct":true,"expl":"Correct. An empyema is frank pus in the pleural space, from bacterial infection or a ruptured abscess."}],"nb":"An exudate more generally is protein/cell-rich with elevated LDH."},{"num":3,"stem":"Which pleuritic pain description is characteristic of pleurisy (pleuritis)?","options":[{"letter":"A","text":"Burning epigastric pain relieved by food","correct":false,"expl":"Burning epigastric pain relieved by food suggests peptic disease, not pleurisy."},{"letter":"B","text":"Painless progressive dyspnea only","correct":false,"expl":"Pleurisy is painful; painless dyspnea points elsewhere."},{"letter":"C","text":"Sharp, abrupt, usually unilateral pain that is worse with inspiration and coughing and may refer to the shoulder","correct":true,"expl":"Correct. Pleuritic pain is sharp, abrupt, usually unilateral, worse with inspiration/coughing/chest movement, and may refer to the shoulder."},{"letter":"D","text":"Dull, constant, midline pressure unaffected by breathing","correct":false,"expl":"Dull midline pressure unaffected by breathing is not pleuritic pain."}],"nb":"Patients take rapid, shallow breaths to minimize painful pleural movement."},{"num":4,"stem":"On examination of a large pleural effusion, which findings are expected, and which way does the mediastinum shift?","options":[{"letter":"A","text":"Normal exam with no shift","correct":false,"expl":"A large effusion is not a normal exam and does shift the mediastinum."},{"letter":"B","text":"Wheezing with the trachea pulled toward the effusion","correct":false,"expl":"An effusion pushes the mediastinum away; it does not pull the trachea toward it."},{"letter":"C","text":"Dullness to percussion and decreased breath sounds; the mediastinum shifts AWAY from the affected side","correct":true,"expl":"Correct. Fluid gives dullness and decreased breath sounds, and a large effusion pushes the mediastinum away from the affected side."},{"letter":"D","text":"Hyperresonance and absent breath sounds; the mediastinum shifts toward the affected side","correct":false,"expl":"Hyperresonance with absent sounds describes a pneumothorax, not an effusion."}],"nb":"Significant effusions are drained by thoracentesis; treat the underlying cause."},{"num":5,"stem":"What is the most common cause of a non-penetrating traumatic pneumothorax?","options":[{"letter":"A","text":"A ruptured subpleural bleb","correct":false,"expl":"A ruptured bleb causes a primary spontaneous pneumothorax, not a traumatic one."},{"letter":"B","text":"Asthma","correct":false,"expl":"Asthma is an underlying disease for secondary spontaneous pneumothorax, not a traumatic cause."},{"letter":"C","text":"Rib fractures","correct":true,"expl":"Correct. Rib fractures are the most common cause of non-penetrating traumatic pneumothorax."},{"letter":"D","text":"Emphysema","correct":false,"expl":"Emphysema underlies a secondary spontaneous pneumothorax."}],"nb":"Other iatrogenic/traumatic causes include CPR, intubation, and needle aspiration."},{"num":6,"stem":"A secondary spontaneous pneumothorax occurs in a patient with which background?","options":[{"letter":"A","text":"Penetrating chest trauma","correct":false,"expl":"Penetrating trauma causes a traumatic pneumothorax, not a spontaneous one."},{"letter":"B","text":"No lung disease, typically a tall thin young man","correct":false,"expl":"A healthy tall thin young man with a ruptured bleb is a PRIMARY spontaneous pneumothorax."},{"letter":"C","text":"Underlying lung disease such as emphysema, TB, asthma, or lung cancer","correct":true,"expl":"Correct. Secondary spontaneous pneumothorax arises on a background of underlying lung disease (emphysema, TB, asthma, cancer)."},{"letter":"D","text":"A normal lung with a rib fracture","correct":false,"expl":"A rib fracture causes traumatic pneumothorax, not secondary spontaneous."}],"nb":"Primary spontaneous pneumothorax has no preceding trauma or known lung disease."},{"num":7,"stem":"In compression atelectasis (from a mass or effusion), which way does the mediastinum move relative to the affected side?","options":[{"letter":"A","text":"Away from the affected side","correct":true,"expl":"Correct. In compression atelectasis, the mass effect pushes the mediastinum AWAY from the affected side."},{"letter":"B","text":"Toward the affected side","correct":false,"expl":"Movement TOWARD the affected side occurs in volume-loss (obstruction) atelectasis."},{"letter":"C","text":"It never moves","correct":false,"expl":"Large processes do shift the mediastinum."},{"letter":"D","text":"Downward toward the diaphragm","correct":false,"expl":"The mediastinum shifts side-to-side, not downward, in these processes."}],"nb":"Contrast: obstruction (volume-loss) atelectasis pulls the trachea toward the collapsed side."},{"num":8,"stem":"Why is atelectasis especially common after surgery?","options":[{"letter":"A","text":"Anesthesia increases surfactant to excess","correct":false,"expl":"The problem is loss (not excess) of effective ventilation/surfactant function."},{"letter":"B","text":"Postoperative patients hyperventilate","correct":false,"expl":"Post-op patients tend to breathe shallowly, not hyperventilate."},{"letter":"C","text":"Surgery destroys type II cells directly","correct":false,"expl":"Surgery does not directly destroy type II cells to cause this."},{"letter":"D","text":"Anesthesia, shallow breathing, pain, and retained secretions promote airway obstruction and alveolar collapse","correct":true,"expl":"Correct. Post\u0002op anesthesia, shallow breathing, pain, and retained secretions promote obstruction and collapse."}],"nb":"Incentive spirometry and early mobilization help prevent post-op atelectasis."},{"num":9,"stem":"How does intrinsic asthma differ from extrinsic asthma?","options":[{"letter":"A","text":"Intrinsic asthma is triggered by allergens; extrinsic asthma has no allergic component","correct":false,"expl":"This reverses the two categories."},{"letter":"B","text":"Neither involves airway inflammation","correct":false,"expl":"Both involve airway inflammation and hyperresponsiveness."},{"letter":"C","text":"Intrinsic asthma has no allergic component; extrinsic asthma is triggered by allergens","correct":true,"expl":"Correct. Intrinsic asthma has no allergic component; extrinsic asthma is an allergen-triggered (type I hypersensitivity) disease."},{"letter":"D","text":"Both are purely genetic with no triggers","correct":false,"expl":"Both have identifiable triggers and are not purely genetic."}],"nb":"Extrinsic asthma often begins in childhood with a familial atopic pattern."},{"num":10,"stem":"Which of the following is a recognized asthma trigger?","options":[{"letter":"A","text":"Exercise, cold air, respiratory infections, and GERD","correct":true,"expl":"Correct. Triggers include exercise, cold air, hyperventilation, infections, tobacco smoke, drugs, hormonal changes, emotional stress, and GERD."},{"letter":"B","text":"Increased dietary fiber","correct":false,"expl":"Dietary fiber is not an asthma trigger."},{"letter":"C","text":"Adequate hydration","correct":false,"expl":"Hydration is not a trigger."},{"letter":"D","text":"Normal sleep","correct":false,"expl":"Normal sleep is not a trigger (though symptoms often worsen at night)."}],"nb":"Managing comorbidities such as GERD, rhinosinusitis, obesity, and OSA improves control."},{"num":11,"stem":"Which treatment concept correctly matches an asthma drug class to its action?","options":[{"letter":"A","text":"Short-acting beta-2 agonists are used only for long-term control","correct":false,"expl":"Short-acting beta-2 agonists are quick-relief (rescue) agents, not long-term controllers."},{"letter":"B","text":"Bronchodilators relax airway smooth muscle to reverse bronchoconstriction; anti-inflammatory agents suppress airway inflammation","correct":true,"expl":"Correct. Bronchodilators relax smooth muscle to open airways; anti-inflammatory agents (e.g., steroids) suppress the underlying inflammation."},{"letter":"C","text":"Bronchodilators suppress inflammation; steroids relax smooth muscle","correct":false,"expl":"This reverses the mechanisms of bronchodilators and steroids."},{"letter":"D","text":"Leukotriene modifiers cause bronchoconstriction","correct":false,"expl":"Leukotriene modifiers block leukotriene-mediated bronchoconstriction, not cause it."}],"nb":"Leukotriene modifiers are used for long-term control by blocking bronchoconstriction."},{"num":12,"stem":"Which finding is characteristic of emphysema?","options":[{"letter":"A","text":"Decreased lung volumes with stiff lungs","correct":false,"expl":"Decreased volumes with stiff lungs describe restrictive disease, the opposite of emphysema's hyperinflation."},{"letter":"B","text":"Copious purulent sputum with rhonchi","correct":false,"expl":"Copious purulent sputum with rhonchi is chronic bronchitis, not emphysema."},{"letter":"C","text":"A barrel-shaped chest from air trapping and an increased anteroposterior diameter","correct":true,"expl":"Correct. Air trapping and hyperinflation increase the AP diameter, producing a barrel chest; patients often purse the lips to breathe."},{"letter":"D","text":"Reversible wheezing after allergen exposure","correct":false,"expl":"Reversible allergen-triggered wheezing is asthma."}],"nb":"Emphysema is subclassified anatomically as panacinar or centriacinar."},{"num":13,"stem":"What is the central pathophysiologic process of chronic bronchitis?","options":[{"letter":"A","text":"Permanent dilation of the bronchi","correct":false,"expl":"Permanent bronchial dilation is bronchiectasis."},{"letter":"B","text":"Fibrosis of the lung interstitium","correct":false,"expl":"Interstitial fibrosis is restrictive lung disease."},{"letter":"C","text":"Destruction of alveolar walls and loss of elastic recoil","correct":false,"expl":"Alveolar-wall destruction with lost recoil is emphysema."},{"letter":"D","text":"Hypertrophy/hyperplasia of mucus glands with excessive mucus, obstructing small airways","correct":true,"expl":"Correct. Chronic irritation causes mucus-gland hypertrophy/hyperplasia and excess mucus that obstructs the small airways, with chronic inflammation and fibrosis."}],"nb":"Chronic bronchitis patients ('blue bloaters') develop early hypoxemia and cor pulmonale."},{"num":14,"stem":"Which is a recognized non-smoking (genetic) cause of COPD?","options":[{"letter":"A","text":"Alpha-1-antitrypsin deficiency","correct":true,"expl":"Correct. Alpha-1-antitrypsin deficiency is a genetic cause of COPD/emphysema apart from smoking."},{"letter":"B","text":"Cystic fibrosis transmembrane regulator excess","correct":false,"expl":"There is no 'CFTR excess'; CFTR loss-of-function causes cystic fibrosis, a different disease."},{"letter":"C","text":"Sickle cell trait","correct":false,"expl":"Sickle cell trait is not a listed COPD cause."},{"letter":"D","text":"G6PD deficiency","correct":false,"expl":"G6PD deficiency causes hemolysis, not COPD."}],"nb":"Smoking remains the most important cause overall."},{"num":15,"stem":"What is the single most important intervention in COPD management?","options":[{"letter":"A","text":"A daily antibiotic","correct":false,"expl":"Antibiotics are for infectious exacerbations, not daily prophylaxis."},{"letter":"B","text":"Smoking cessation","correct":true,"expl":"Correct. Smoking cessation is the single most important intervention in COPD."},{"letter":"C","text":"Lung transplantation for everyone","correct":false,"expl":"Transplantation is reserved for advanced disease, not everyone."},{"letter":"D","text":"Chronic systemic steroids for all patients","correct":false,"expl":"Chronic systemic steroids are not standard for all COPD patients."}],"nb":"Other measures: inhaled bronchodilators/anticholinergics, oxygen for resting hypoxemia, and influenza/pneumococcal vaccination."},{"num":16,"stem":"Which self-perpetuating cycle drives bronchiectasis?","options":[{"letter":"A","text":"Fibrosis → reduced compliance → reduced volumes","correct":false,"expl":"Fibrosis reducing compliance and volumes is restrictive disease."},{"letter":"B","text":"Poor clearance → retained secretions → infection → inflammation → airway-wall destruction → further dilation → even poorer clearance","correct":true,"expl":"Correct. Bronchiectasis is a vicious cycle in which poor clearance and infection destroy the airway wall, causing permanent dilation and still worse clearance."},{"letter":"C","text":"Allergen exposure → reversible bronchospasm that fully resolves","correct":false,"expl":"Reversible bronchospasm that resolves is asthma, not the destructive dilation of bronchiectasis."},{"letter":"D","text":"Alveolar-wall destruction → loss of recoil → air trapping","correct":false,"expl":"Alveolar-wall destruction with air trapping is emphysema."}],"nb":"Causes include cystic fibrosis, Kartagener syndrome, obstruction, and necrotizing infections such as TB."},{"num":17,"stem":"Beyond the lungs, cystic fibrosis characteristically produces which set of manifestations?","options":[{"letter":"A","text":"Cirrhosis from alcohol and esophageal varices","correct":false,"expl":"Alcoholic cirrhosis/varices are not CF manifestations."},{"letter":"B","text":"Hyperthyroidism and exophthalmos","correct":false,"expl":"Thyroid eye disease is unrelated to CF."},{"letter":"C","text":"Pancreatic exocrine insufficiency, high sweat NaCl, nasal polyps, and sinus infections","correct":true,"expl":"Correct. CF produces pancreatic exocrine insufficiency (and pancreatitis), high sweat NaCl, nasal polyps, sinus infections, and cholelithiasis."},{"letter":"D","text":"Chronic kidney stones from gout","correct":false,"expl":"Gouty kidney stones are unrelated to CF."}],"nb":"CFTR-targeted therapy such as ivacaftor/lumacaftor helps appropriate mutations."},{"num":18,"stem":"Which occupational/environmental restrictive lung disease is most strongly linked to mesothelioma and an increased risk of lung cancer?","options":[{"letter":"A","text":"Simple coal dust exposure","correct":false,"expl":"Simple coal exposure is not the mesothelioma-linked exposure."},{"letter":"B","text":"Asbestosis","correct":true,"expl":"Correct. Asbestos exposure (asbestosis) is particularly associated with mesothelioma and increased lung-cancer risk."},{"letter":"C","text":"Silicosis","correct":false,"expl":"Silicosis is a restrictive pneumoconiosis but is not the classic mesothelioma association."},{"letter":"D","text":"Byssinosis","correct":false,"expl":"Byssinosis is a cotton-worker disease with features of pneumoconiosis and hypersensitivity, not the mesothelioma link."}],"nb":"Occupational lung diseases are usually worsened by concurrent smoking."},{"num":19,"stem":"Besides a thrombus from a deep vein, which other materials can cause a pulmonary embolism?","options":[{"letter":"A","text":"Swallowed food particles","correct":false,"expl":"Swallowed food goes to the GI tract, not the pulmonary vasculature."},{"letter":"B","text":"Fat (after a fracture) and amniotic fluid (during delivery)","correct":true,"expl":"Correct. Emboli can be thrombotic (from DVT), fat (mobilized after a fracture), or amniotic fluid (entering maternal circulation at delivery)."},{"letter":"C","text":"Inhaled pollen and dust","correct":false,"expl":"Inhaled pollen/dust cause airway, not embolic, disease."},{"letter":"D","text":"Excess surfactant","correct":false,"expl":"Surfactant is an alveolar substance, not an embolus."}],"nb":"Treatment prevents further emboli - anticoagulation, sometimes thrombolysis, embolectomy, or a vena cava (Greenfield) filter."},{"num":20,"stem":"Which set of conditions causes primarily HYPOXEMIC respiratory failure (an oxygenation problem)?","options":[{"letter":"A","text":"ARDS, pneumonia, pulmonary edema, and V/Q mismatch","correct":true,"expl":"Correct. Hypoxemic failure is an oxygenation problem from ARDS, pneumonia, pulmonary edema, COPD, or V/Q mismatch."},{"letter":"B","text":"Upper-airway obstruction and brain injury","correct":false,"expl":"Upper-airway obstruction and brain injury impair ventilation, causing hypercapnic failure."},{"letter":"C","text":"Drug overdose and Guillain-Barré syndrome","correct":false,"expl":"Drug overdose and Guillain-Barré cause hypercapnic (ventilatory) failure."},{"letter":"D","text":"Spinal cord injury and muscular dystrophy","correct":false,"expl":"Spinal cord injury and muscular dystrophy cause ventilatory (hypercapnic) failure."}],"nb":"Hypercapnic failure is inadequate alveolar ventilation that fails to clear CO₂."},{"num":21,"stem":"A patient has progressive dyspnea; exam shows dullness to percussion and decreased breath sounds at the right base, and a chest film shows fluid with the mediastinum shifted to the left. What is the diagnosis and a first therapeutic step?","options":[{"letter":"A","text":"Left tension pneumothorax","correct":false,"expl":"chest tube - The pathology is a right-sided fluid collection, not a left tension pneumothorax."},{"letter":"B","text":"Right pleural effusion","correct":true,"expl":"thoracentesis (and treat the underlying cause) - Correct. Dullness, decreased breath sounds, and a large fluid collection shifting the mediastinum away indicate a pleural effusion; significant effusions are drained by thoracentesis while treating the cause."},{"letter":"C","text":"Right pneumothorax","correct":false,"expl":"needle decompression - A pneumothorax gives hyperresonance and absent breath sounds, not dullness with fluid."},{"letter":"D","text":"Right lobar pneumonia","correct":false,"expl":"antibiotics only - Pneumonia gives consolidation signs; the film here shows a fluid collection with mediastinal shift."}],"nb":"A large effusion pushes the mediastinum away from the affected side."},{"num":22,"stem":"After blunt chest trauma with several rib fractures, a patient has sudden dyspnea and decreased breath sounds on the injured side. Which type of pneumothorax is most likely?","options":[{"letter":"A","text":"Traumatic pneumothorax","correct":true,"expl":"Correct. Rib fractures are the most common cause of a non-penetrating traumatic pneumothorax."},{"letter":"B","text":"Secondary spontaneous pneumothorax","correct":false,"expl":"Secondary spontaneous pneumothorax occurs on a background of underlying lung disease, not acute trauma."},{"letter":"C","text":"No pneumothorax","correct":false,"expl":"this is normal after trauma - New dyspnea with decreased breath sounds after trauma is not normal and warrants evaluation."},{"letter":"D","text":"Primary spontaneous pneumothorax","correct":false,"expl":"Primary spontaneous pneumothorax occurs without trauma in healthy tall thin young people."}],"nb":"Watch for progression to tension physiology (hypotension, tracheal deviation away)."},{"num":23,"stem":"A patient with childhood-onset allergic asthma has episodic wheezing and dyspnea that worsen at night; spirometry shows an obstructive pattern that improves with a bronchodilator. Which hypersensitivity type underlies the allergic (extrinsic) form?","options":[{"letter":"A","text":"Type I hypersensitivity","correct":true,"expl":"Correct. Extrinsic (allergic) asthma is a type I hypersensitivity response, with histamine and leukotrienes driving the early phase."},{"letter":"B","text":"Type IV hypersensitivity","correct":false,"expl":"Type IV is delayed cell-mediated hypersensitivity, not the immediate allergic asthma response."},{"letter":"C","text":"Type II hypersensitivity","correct":false,"expl":"Type II is antibody-mediated cytotoxicity, not allergic asthma."},{"letter":"D","text":"Type III hypersensitivity","correct":false,"expl":"Type III is immune-complex disease, not allergic asthma."}],"nb":"Eosinophils drive the late-phase response hours after exposure."},{"num":24,"stem":"A cyanotic, edematous smoker has a chronic productive cough, rhonchi, and signs of right heart failure, with hypoxemia earlier in the disease course. Which COPD phenotype does this describe?","options":[{"letter":"A","text":"Chronic bronchitis ('blue bloater')","correct":true,"expl":"Correct. Cyanosis, edema, productive cough, rhonchi, and early cor pulmonale describe the chronic bronchitis 'blue bloater'."},{"letter":"B","text":"Restrictive interstitial disease","correct":false,"expl":"Restrictive disease reduces volumes and does not cause this mucus-and-cyanosis picture."},{"letter":"C","text":"Bronchiectasis","correct":false,"expl":"Bronchiectasis produces copious foul-smelling sputum, not this specific blue-bloater picture."},{"letter":"D","text":"Emphysema ('pink puffer')","correct":false,"expl":"The emphysema 'pink puffer' is thin, barrel-chested, with near-normal gases until late and little sputum."}],"nb":"Blue bloaters lose ventilation and perfusion disproportionately (V/Q mismatch), becoming cyanotic."},{"num":25,"stem":"An infant has recurrent respiratory infections, bulky greasy stools, poor weight gain, and unusually salty-tasting skin. Which test confirms the suspected diagnosis?","options":[{"letter":"A","text":"Quantitative pilocarpine iontophoresis sweat test (for cystic fibrosis)","correct":true,"expl":"Correct. Recurrent infections, pancreatic-insufficiency stools, failure to thrive, and salty skin point to cystic fibrosis, confirmed by the sweat chloride test."},{"letter":"B","text":"Peak expiratory flow","correct":false,"expl":"Peak flow monitors airflow obstruction, not CF diagnosis."},{"letter":"C","text":"Tuberculin skin test","correct":false,"expl":"The tuberculin test screens for TB exposure."},{"letter":"D","text":"D-dimer","correct":false,"expl":"D-dimer evaluates thromboembolism, not CF."}],"nb":"CF is autosomal recessive from CFTR mutations on chromosome 7."},{"num":26,"stem":"Three days after hip surgery, a patient suddenly develops pleuritic chest pain, dyspnea, tachypnea, and apprehension. Which diagnosis and confirmatory tests fit best?","options":[{"letter":"A","text":"Acute asthma","correct":false,"expl":"peak expiratory flow - Asthma causes wheezing, not sudden pleuritic pain with apprehension after surgery."},{"letter":"B","text":"Pulmonary embolism","correct":true,"expl":"D-dimer, V/Q scan, or CT angiography - Correct. Sudden pleuritic chest pain, dyspnea, tachypnea, and apprehension after immobilizing surgery indicate pulmonary embolism, evaluated with D-dimer, V/Q scan, or CT angiography."},{"letter":"C","text":"Pleural effusion","correct":false,"expl":"thoracentesis - A pleural effusion causes dullness and gradual dyspnea, not this abrupt embolic presentation."},{"letter":"D","text":"Chronic bronchitis","correct":false,"expl":"sputum culture - Chronic bronchitis is a chronic productive-cough disease, not an acute post-op event."}],"nb":"Emboli usually arise from an iliofemoral DVT and cause V/Q mismatch (ventilation without perfusion)."}],"33":[{"num":1,"stem":"Normal kidney formation requires three steps. Which sequence is correct?","options":[{"letter":"A","text":"Induce → rotate → descend into the pelvis","correct":false,"expl":"The kidney ascends (not descends) and the final step is medial rotation, not descent."},{"letter":"B","text":"Induce (ureteric bud meets mesenchyme) → ascend (pelvis to flank) → rotate (hilum faces medially)","correct":true,"expl":"Correct. The kidney is induced (bud meets mesenchyme), ascends from the pelvis to the flank, then rotates so the hilum faces medially."},{"letter":"C","text":"Rotate → ascend → induce","correct":false,"expl":"This reverses the order; induction comes first."},{"letter":"D","text":"Ascend → rotate → induce","correct":false,"expl":"Ascent cannot precede induction - the organ must first be induced to form."}],"nb":"No bud = agenesis; a weak signal = hypoplasia; disorganized signaling = dysplasia."},{"num":2,"stem":"How do unilateral and bilateral renal agenesis differ in outcome?","options":[{"letter":"A","text":"Unilateral is usually silent (the other kidney hypertrophies); bilateral is lethal because no fetal urine leads to oligohydramnios and the lungs never develop","correct":true,"expl":"Correct. With one kidney the other hypertrophies and life is usually normal; with no kidneys there is no fetal urine, causing oligohydramnios and fatal pulmonary hypoplasia."},{"letter":"B","text":"Unilateral is lethal; bilateral is silent","correct":false,"expl":"This reverses the two - bilateral is the lethal one."},{"letter":"C","text":"Both are silent and require no follow-up","correct":false,"expl":"Bilateral agenesis is lethal, and a solitary kidney warrants protection."},{"letter":"D","text":"Both are lethal at birth","correct":false,"expl":"Only bilateral agenesis is lethal."}],"nb":"Advise protecting a solitary kidney (e.g., contact-sports counseling)."},{"num":3,"stem":"Which chain of events defines the Potter sequence?","options":[{"letter":"A","text":"Immune complexes → glomerular injury → hematuria","correct":false,"expl":"Immune-complex glomerular injury is a filter disease, not the Potter sequence."},{"letter":"B","text":"Maternal diabetes → large kidneys → hypertension","correct":false,"expl":"Maternal diabetes is unrelated to the Potter sequence mechanism."},{"letter":"C","text":"Excess fetal urine → polyhydramnios → macrosomia","correct":false,"expl":"The Potter sequence is driven by too LITTLE amniotic fluid, not too much."},{"letter":"D","text":"No fetal urine → oligohydramnios → fetal compression (flat face, low ears, club feet) → pulmonary hypoplasia and death","correct":true,"expl":"Correct. Absent fetal urine causes oligohydramnios; the low fluid compresses the fetus (flat face, low-set ears, club feet) and prevents lung growth, which is fatal."}],"nb":"Memory hook: no fetal urine, no lungs."},{"num":4,"stem":"Which is the most common renal anomaly, formed when the lower poles fuse and the kidney is caught under the inferior mesenteric artery?","options":[{"letter":"A","text":"Horseshoe kidney","correct":true,"expl":"Correct. A horseshoe kidney (fused poles caught under the IMA) occurs in about 1 in 500 and is the most common anomaly."},{"letter":"B","text":"Ectopic (pelvic) kidney","correct":false,"expl":"An ectopic kidney is stuck in the pelvis but is not the fused-pole 'caught under the IMA' anomaly."},{"letter":"C","text":"Simple renal cyst","correct":false,"expl":"A simple cyst is an acquired cystic finding, not a fusion anomaly."},{"letter":"D","text":"Renal agenesis","correct":false,"expl":"Agenesis is absence of a kidney, not fusion."}],"nb":"Anomalies matter because poor drainage predisposes to stones, UTI, and hydronephrosis."},{"num":5,"stem":"Why do congenital positional/fusion anomalies (ectopic, horseshoe) matter clinically?","options":[{"letter":"A","text":"They have no clinical significance","correct":false,"expl":"They do matter - precisely because of drainage problems."},{"letter":"B","text":"They always cause immediate kidney failure","correct":false,"expl":"They do not cause immediate renal failure by themselves."},{"letter":"C","text":"They convert into cancer within months","correct":false,"expl":"They are not premalignant lesions that rapidly become cancer."},{"letter":"D","text":"Poor drainage predisposes to stones, UTI, and hydronephrosis","correct":true,"expl":"Correct. The shared theme is impaired drainage, which predisposes to stones, urinary infection, and hydronephrosis."}],"nb":"Hypoplasia (small kidney, fewer nephrons) and ectopia (pelvic kidney) are the other listed anomalies."},{"num":6,"stem":"Hypoplasia of the kidney is best described as:","options":[{"letter":"A","text":"A kidney fused at the lower poles","correct":false,"expl":"Fused lower poles describe a horseshoe kidney."},{"letter":"B","text":"A kidney full of large cysts","correct":false,"expl":"Large cysts describe polycystic kidney disease, not hypoplasia."},{"letter":"C","text":"Complete absence of the kidney","correct":false,"expl":"Absence of the kidney is agenesis, not hypoplasia."},{"letter":"D","text":"A small kidney with fewer nephrons","correct":true,"expl":"Correct. Hypoplasia is a small kidney with fewer nephrons (from a weak inductive signal)."}],"nb":"No bud = agenesis; weak signal = hypoplasia; disorganized signaling = dysplasia."},{"num":7,"stem":"A simple renal cyst discovered incidentally on imaging in an asymptomatic adult should prompt:","options":[{"letter":"A","text":"Reassurance","correct":true,"expl":"it is common and harmless - Correct. Simple cysts are common, harmless, and incidental - reassure the patient."},{"letter":"B","text":"Lifelong dialysis","correct":false,"expl":"A simple cyst does not require dialysis."},{"letter":"C","text":"Immediate nephrectomy","correct":false,"expl":"Nephrectomy is not indicated for a benign simple cyst."},{"letter":"D","text":"Chemotherapy","correct":false,"expl":"Chemotherapy has no role for a benign cyst."}],"nb":"Acquired cystic disease (small dialysis kidneys) is different - it can bleed and needs screening for renal cell carcinoma."},{"num":8,"stem":"Acquired cystic kidney disease, seen in long-term dialysis patients, warrants surveillance for which complication?","options":[{"letter":"A","text":"Berry aneurysm","correct":false,"expl":"Berry aneurysm is the feared association of ADPKD, not acquired cystic disease."},{"letter":"B","text":"Congenital hepatic fibrosis","correct":false,"expl":"Congenital hepatic fibrosis is a feature of ARPKD."},{"letter":"C","text":"Wilms tumor","correct":false,"expl":"Wilms tumor is a childhood tumor unrelated to dialysis-associated cysts."},{"letter":"D","text":"Renal cell carcinoma","correct":true,"expl":"Correct. Acquired cystic disease (small dialysis kidneys that can bleed) requires screening for renal cell carcinoma."}],"nb":"These kidneys are small (unlike the huge kidneys of ADPKD) and can bleed."},{"num":9,"stem":"Most inherited cystic kidney diseases are ciliopathies. What is the underlying cellular defect?","options":[{"letter":"A","text":"Loss of type IV collagen in the basement membrane","correct":false,"expl":"Type IV collagen loss is Alport syndrome, not the ciliopathy mechanism."},{"letter":"B","text":"Deposition of immune complexes in the mesangium","correct":false,"expl":"Mesangial immune complexes describe IgA nephropathy, a glomerular disease."},{"letter":"C","text":"A broken flow sensor (cilium), so the tubular cell secretes fluid instead of absorbing it","correct":true,"expl":"Correct. In ciliopathies the flow-sensing cilium is broken, so tubular cells secrete rather than absorb, forming cysts."},{"letter":"D","text":"Overactive glomerular filtration","correct":false,"expl":"Cyst formation is a tubular secretion problem, not glomerular hyperfiltration."}],"nb":"Nephronophthisis is a recessive ciliopathy with cysts at the corticomedullary junction."},{"num":10,"stem":"Autosomal dominant polycystic kidney disease (ADPKD) is most often caused by a mutation in which gene, and by what genetic model do cysts form?","options":[{"letter":"A","text":"PKD1 (polycystin); a somatic 'second hit' turns single tubules into cysts over decades","correct":true,"expl":"Correct. ADPKD is usually PKD1 (or PKD2); polycystin fails, and a somatic two-hit converts individual tubules into cysts that grow for decades."},{"letter":"B","text":"WT1; a childhood renal tumor","correct":false,"expl":"WT1 is the Wilms tumor gene, not ADPKD."},{"letter":"C","text":"PKHD1 (fibrocystin); cysts present at birth","correct":false,"expl":"PKHD1/fibrocystin is the ARPKD (infant) gene, not ADPKD."},{"letter":"D","text":"Type IV collagen; hematuria with deafness","correct":false,"expl":"Type IV collagen defects cause Alport syndrome, not ADPKD."}],"nb":"PKD1 accounts for ~85%; about half of patients reach end-stage kidney disease by age 60."},{"num":11,"stem":"Which cluster is the typical renal presentation of ADPKD in an adult?","options":[{"letter":"A","text":"Nephrotic-range proteinuria and edema","correct":false,"expl":"Heavy proteinuria with edema is nephrotic syndrome, not ADPKD."},{"letter":"B","text":"Isolated deafness with hematuria","correct":false,"expl":"Deafness with hematuria is Alport syndrome."},{"letter":"C","text":"Painless abdominal mass with hypertension in a toddler","correct":false,"expl":"A painless abdominal mass in a toddler is Wilms tumor."},{"letter":"D","text":"Flank pain, gross hematuria, hypertension, renal colic, and recurrent UTIs","correct":true,"expl":"Correct. ADPKD presents with flank pain, gross hematuria, hypertension, renal colic, and recurrent UTIs."}],"nb":"About half reach end-stage kidney disease by 60."},{"num":12,"stem":"Which extrarenal finding of ADPKD is the feared 'sudden killer' that warrants screening when there is a family history?","options":[{"letter":"A","text":"Colonic diverticula","correct":false,"expl":"Colonic diverticula are an ADPKD association but not the catastrophic one."},{"letter":"B","text":"An inguinal hernia","correct":false,"expl":"Hernias are an ADPKD association but not the feared aneurysmal rupture."},{"letter":"C","text":"A single liver cyst","correct":false,"expl":"Liver cysts are the most common extrarenal finding but are not the lethal 'sudden killer.'"},{"letter":"D","text":"Cerebral (berry) aneurysm","correct":true,"expl":"Correct. Berry aneurysms can rupture and are the sudden killer; screen with cerebral imaging when the family history includes aneurysm."}],"nb":"Other extrarenal features: liver cysts (most common), mitral valve prolapse, aortic root dilation, diverticula, and hernias."},{"num":13,"stem":"Why is a RAAS blocker (ACE inhibitor/ARB), rather than a diuretic, first-line for the hypertension of ADPKD?","options":[{"letter":"A","text":"The cysts secrete aldosterone directly","correct":false,"expl":"The cysts do not directly secrete aldosterone; renin release is the mechanism."},{"letter":"B","text":"The hypertension is purely volume overload","correct":false,"expl":"It is renin-driven, not simply volume overload."},{"letter":"C","text":"Pain is the only cause of the blood-pressure elevation","correct":false,"expl":"Pain is not the driver of the sustained hypertension."},{"letter":"D","text":"Expanding cysts compress intrarenal vessels; the juxtaglomerular apparatus senses low flow and releases renin, so the hypertension is renin-driven","correct":true,"expl":"Correct. Cysts squeeze intrarenal vessels; the JGA reads the local ischemia as low flow and releases renin, so RAAS blockade is first-line."}],"nb":"Tolvaptan (a V2 antagonist) lowers cyclic AMP and slows cyst growth; water intake suppresses vasopressin similarly."},{"num":14,"stem":"Autosomal recessive polycystic kidney disease (ARPKD) is characterized by:","options":[{"letter":"A","text":"PKHD1/fibrocystin, collecting-duct cysts, and congenital hepatic fibrosis presenting in infancy","correct":true,"expl":"Correct. ARPKD is caused by PKHD1 (fibrocystin) with collecting-duct cysts and congenital hepatic fibrosis; infants present with flank masses and the Potter sequence."},{"letter":"B","text":"Anti-PLA2R antibodies with heavy proteinuria","correct":false,"expl":"Anti-PLA2R with proteinuria is membranous nephropathy."},{"letter":"C","text":"WT1 mutation with a childhood renal mass","correct":false,"expl":"WT1 with a renal mass is Wilms tumor."},{"letter":"D","text":"PKD1/polycystin with huge lumpy kidneys in adults","correct":false,"expl":"PKD1 with huge lumpy adult kidneys is ADPKD, not ARPKD."}],"nb":"ARPKD kidneys are big and smooth; congenital hepatic fibrosis leads to portal hypertension later."},{"num":15,"stem":"Which cystic disease is a recessive ciliopathy with cysts at the corticomedullary junction, presents first with polyuria, and is the top genetic cause of end-stage kidney disease in children?","options":[{"letter":"A","text":"Acquired cystic disease","correct":false,"expl":"Acquired cystic disease occurs in dialysis patients, not as a pediatric genetic ESKD cause."},{"letter":"B","text":"Nephronophthisis","correct":true,"expl":"Correct. Nephronophthisis is a recessive ciliopathy with corticomedullary-junction cysts; its first sign is polyuria and it is the leading genetic cause of ESKD in children."},{"letter":"C","text":"ADPKD","correct":false,"expl":"ADPKD is an adult-onset dominant disease with huge kidneys."},{"letter":"D","text":"Simple renal cysts","correct":false,"expl":"Simple cysts are benign incidental findings."}],"nb":"Polyuria reflects an early concentrating defect at the medulla."},{"num":16,"stem":"Which comparison of ADPKD versus ARPKD is correct?","options":[{"letter":"A","text":"ADPKD: liver fibrosis; ARPKD: liver cysts","correct":false,"expl":"ADPKD has liver CYSTS and ARPKD has hepatic FIBROSIS - this option swaps them."},{"letter":"B","text":"ADPKD: newborns; ARPKD: adults","correct":false,"expl":"This reverses the ages."},{"letter":"C","text":"ADPKD: adults, huge lumpy kidneys, liver cysts, berry-aneurysm danger; ARPKD: newborns, big smooth kidneys, hepatic fibrosis, lung-hypoplasia danger","correct":true,"expl":"Correct. ADPKD is the adult disease (huge lumpy kidneys, liver cysts, berry aneurysm); ARPKD is the infant disease (big smooth kidneys, hepatic fibrosis, lung hypoplasia)."},{"letter":"D","text":"Both present identically in adulthood","correct":false,"expl":"They present at very different ages and differ in organ findings."}],"nb":"ADPKD danger = berry aneurysm; ARPKD danger = pulmonary hypoplasia (from the Potter sequence)."},{"num":17,"stem":"Which pairing of obstruction site and typical presentation is correct?","options":[{"letter":"A","text":"Both stones and BPH are painless and asymptomatic","correct":false,"expl":"A ureteral stone is characteristically very painful, not silent."},{"letter":"B","text":"A ureteral stone: sudden and painful; BPH at the bladder outlet: slow and painless","correct":true,"expl":"Correct. A stone lodging in the ureter is sudden and painful, while bladder-outlet obstruction from BPH is slow and painless."},{"letter":"C","text":"Both cause instant anuria in everyone","correct":false,"expl":"Neither reliably causes instant anuria unless drainage of both kidneys is blocked."},{"letter":"D","text":"A ureteral stone: slow and painless; BPH: sudden and painful","correct":false,"expl":"This reverses the two presentations."}],"nb":"Other causes: tumors, strictures, pregnancy, neurogenic bladder, and reflux."},{"num":18,"stem":"After a one-sided ureteral obstruction, why might the serum creatinine stay normal?","options":[{"letter":"A","text":"Creatinine rises only when BOTH sides are blocked, or when there is a single functioning kidney","correct":true,"expl":"Correct. A healthy contralateral kidney maintains clearance, so creatinine rises only with bilateral obstruction or obstruction of a solitary kidney."},{"letter":"B","text":"Creatinine never changes with obstruction","correct":false,"expl":"Creatinine does rise with bilateral (or solitary-kidney) obstruction."},{"letter":"C","text":"The blocked kidney increases filtration to compensate","correct":false,"expl":"Obstruction lowers, not raises, filtration in the affected kidney."},{"letter":"D","text":"One blocked ureter always doubles the creatinine","correct":false,"expl":"A single blocked ureter usually does not raise creatinine if the other kidney works."}],"nb":"This is why bilateral hydronephrosis from bladder-outlet obstruction can cause renal failure."},{"num":19,"stem":"Obstruction injures the kidney by two main routes. Which pair is correct?","options":[{"letter":"A","text":"Podocyte injury and heavy proteinuria","correct":false,"expl":"Podocyte injury with proteinuria is nephrotic syndrome, not obstruction."},{"letter":"B","text":"Vasculitis and crescent formation","correct":false,"expl":"Vasculitis/crescents describe rapidly progressive glomerulonephritis."},{"letter":"C","text":"Hyperfiltration and immune-complex deposition","correct":false,"expl":"Hyperfiltration and immune complexes describe glomerular disease, not obstruction."},{"letter":"D","text":"Stasis (promoting infection and stones) and back-pressure (collapsing the filtration gradient)","correct":true,"expl":"Correct. Obstruction causes stasis (infection and stones) and back-pressure (the filtration gradient collapses), progressing to hydronephrosis."}],"nb":"The medulla is injured first, so polyuria precedes oliguria."},{"num":20,"stem":"Early in obstructive injury, which functional change appears first, and why?","options":[{"letter":"A","text":"Hematuria with RBC casts, because the glomerulus is inflamed","correct":false,"expl":"RBC casts indicate glomerular inflammation, not obstruction."},{"letter":"B","text":"Oliguria immediately, because filtration stops at once","correct":false,"expl":"Oliguria is a later development, not the immediate first change."},{"letter":"C","text":"Polyuria before oliguria, because the medulla (concentrating region) is injured first","correct":true,"expl":"Correct. The medulla is injured first, impairing concentration, so polyuria precedes the later oliguria."},{"letter":"D","text":"Massive proteinuria, because podocytes are destroyed","correct":false,"expl":"Heavy proteinuria is nephrotic-range podocyte injury, not the obstructive pattern."}],"nb":"Chronic obstruction is often painless - 'the quiet one is the dangerous one.'"},{"num":21,"stem":"Which statement contrasts acute and chronic obstruction correctly?","options":[{"letter":"A","text":"Chronic obstruction never damages the kidney","correct":false,"expl":"Chronic obstruction causes silent, permanent kidney loss."},{"letter":"B","text":"Acute: painless and silent; chronic: severe colic","correct":false,"expl":"This reverses the two - chronic is the silent one."},{"letter":"C","text":"Both are always painful and obvious","correct":false,"expl":"Chronic obstruction is characteristically painless, not obvious."},{"letter":"D","text":"Acute: severe colic, hematuria, an emergency if febrile; chronic: often painless with polyuria/nocturia and silent kidney loss","correct":true,"expl":"Correct. Acute obstruction causes severe colic and hematuria (an emergency if febrile), while chronic obstruction is often painless with polyuria/nocturia and quietly destroys the kidney."}],"nb":"Pain gets treated; silence gets scarred."},{"num":22,"stem":"As back-pressure from obstruction worsens, hydronephrosis progresses in which order?","options":[{"letter":"A","text":"Caliectasis → cortical thickening → recovery","correct":false,"expl":"The cortex thins (not thickens), and the damage is permanent."},{"letter":"B","text":"Immediate cortical thickening with no dilation","correct":false,"expl":"Obstruction causes dilation and thinning, not cortical thickening."},{"letter":"C","text":"Cortical thinning → caliectasis → pelviectasis","correct":false,"expl":"This reverses the sequence; dilation of the pelvis comes first."},{"letter":"D","text":"Pelviectasis (pelvis dilates) → caliectasis (calyces blunt/balloon) → cortical thinning (nephrons lost for good)","correct":true,"expl":"Correct. The pelvis dilates first (pelviectasis), then the calyces blunt and balloon (caliectasis), and finally the cortex thins as nephrons are lost permanently."}],"nb":"Cortical thinning marks irreversible nephron loss and permanent scarring."},{"num":23,"stem":"A newborn has a flattened face, low-set ears, and club feet, and dies shortly after birth from respiratory failure; the pregnancy had severe oligohydramnios. What underlies this?","options":[{"letter":"A","text":"The Potter sequence from bilateral renal agenesis (no fetal urine → oligohydramnios → compression and pulmonary hypoplasia)","correct":true,"expl":"Correct. No fetal urine (bilateral agenesis) causes oligohydramnios; compression gives the facies and club feet, and the lungs never grow - the fatal Potter sequence."},{"letter":"B","text":"A ureteral stone","correct":false,"expl":"A stone is an obstructive problem in older patients, not this neonatal picture."},{"letter":"C","text":"Autosomal dominant polycystic kidney disease","correct":false,"expl":"ADPKD is an adult disease and does not cause this neonatal lethal sequence."},{"letter":"D","text":"Post-streptococcal glomerulonephritis","correct":false,"expl":"PSGN is a childhood glomerular disease, unrelated to oligohydramnios and pulmonary hypoplasia."}],"nb":"No fetal urine, no lungs."},{"num":24,"stem":"An adult is incidentally found to have a single kidney that is enlarged; the contralateral kidney never formed. He is asymptomatic. What is the best counseling?","options":[{"letter":"A","text":"He needs urgent nephrectomy","correct":false,"expl":"Removing the only kidney would be catastrophic."},{"letter":"B","text":"He has bilateral agenesis","correct":false,"expl":"Bilateral agenesis is incompatible with life beyond birth."},{"letter":"C","text":"Unilateral agenesis","correct":true,"expl":"the solitary kidney has hypertrophied; protect it (e.g., caution with contact sports) - Correct. In unilateral agenesis the remaining kidney hypertrophies and life is usually normal; the priority is protecting the solitary kidney."},{"letter":"D","text":"This is lethal and requires immediate dialysis","correct":false,"expl":"Unilateral agenesis is not lethal and does not require dialysis."}],"nb":"Solitary-kidney patients get contact-sports and nephrotoxin counseling."},{"num":25,"stem":"Imaging in an adult shows the kidneys fused at their lower poles, with the isthmus caught beneath the inferior mesenteric artery. Which anomaly is this, and why does it matter?","options":[{"letter":"A","text":"Renal agenesis","correct":false,"expl":"no functioning kidney tissue - Agenesis is absence of kidney tissue, not fusion."},{"letter":"B","text":"Wilms tumor","correct":false,"expl":"a malignant mass - Wilms tumor is a solid childhood malignancy, not a fusion anomaly."},{"letter":"C","text":"A simple cyst","correct":false,"expl":"benign and incidental - A simple cyst is a fluid-filled benign lesion, not fused kidneys."},{"letter":"D","text":"Horseshoe kidney","correct":true,"expl":"the most common anomaly; impaired drainage predisposes to stones, UTI, and hydronephrosis - Correct. Fused lower poles caught under the IMA is a horseshoe kidney (~1 in 500, the commonest anomaly); poor drainage predisposes to stones, UTI, and hydronephrosis."}],"nb":"The clinical theme of positional anomalies is drainage failure."},{"num":26,"stem":"A 38-year-old whose father is on dialysis has flank pain, hematuria, huge cystic kidneys, and a BP of 162/98. What best explains the hypertension?","options":[{"letter":"A","text":"Pain alone","correct":false,"expl":"Pain does not explain the sustained hypertension."},{"letter":"B","text":"Expanding cysts compress intrarenal vessels, the juxtaglomerular apparatus senses low flow, and renin rises","correct":true,"expl":"Correct. In ADPKD, cysts compress intrarenal vessels; the JGA reads local ischemia as low flow and releases renin, so the hypertension is renin\u0002driven (RAAS blockade first-line)."},{"letter":"C","text":"Adrenal cysts secreting aldosterone","correct":false,"expl":"The mechanism is intrarenal vessel compression and renin, not adrenal cysts."},{"letter":"D","text":"Pure volume overload","correct":false,"expl":"It is renin-driven, not simply volume overload."}],"nb":"That is why an ACE inhibitor/ARB, not a diuretic, is first-line."},{"num":27,"stem":"A patient with known ADPKD and a family history of aneurysm develops the sudden 'worst headache of my life.' What complication must be excluded?","options":[{"letter":"A","text":"Colonic diverticulitis","correct":false,"expl":"Diverticulitis causes abdominal pain, not a sudden severe headache."},{"letter":"B","text":"Ruptured cerebral (berry) aneurysm","correct":true,"expl":"Correct. Berry aneurysm is the ADPKD 'sudden killer'; a thunderclap headache in ADPKD suggests aneurysmal rupture and warrants urgent evaluation."},{"letter":"C","text":"A new liver cyst","correct":false,"expl":"A liver cyst is common but does not cause a thunderclap headache."},{"letter":"D","text":"An inguinal hernia","correct":false,"expl":"A hernia does not cause this presentation."}],"nb":"Screen with cerebral imaging when the family history includes aneurysm."},{"num":28,"stem":"A newborn has bilateral flank masses and the Potter sequence; ultrasound shows big smooth kidneys, and there is congenital hepatic fibrosis. Which disease is this?","options":[{"letter":"A","text":"Autosomal recessive polycystic kidney disease (ARPKD)","correct":true,"expl":"Correct. Infant onset with flank masses, big smooth kidneys, the Potter sequence, and congenital hepatic fibrosis is ARPKD (PKHD1/fibrocystin)."},{"letter":"B","text":"Simple renal cysts","correct":false,"expl":"Simple cysts are benign incidental findings, not this neonatal syndrome."},{"letter":"C","text":"Autosomal dominant polycystic kidney disease (ADPKD)","correct":false,"expl":"ADPKD is an adult disease with huge lumpy kidneys and liver cysts."},{"letter":"D","text":"Nephronophthisis","correct":false,"expl":"Nephronophthisis presents in children with polyuria and small kidneys, not neonatal flank masses."}],"nb":"ARPKD hepatic fibrosis leads to portal hypertension later."},{"num":29,"stem":"A school-aged child has polyuria and progresses toward end-stage kidney disease; imaging shows small kidneys with cysts at the corticomedullary junction. What is the likely diagnosis?","options":[{"letter":"A","text":"Nephronophthisis","correct":true,"expl":"Correct. Nephronophthisis is a recessive ciliopathy with corticomedullary-junction cysts, presenting first with polyuria; it is the top genetic cause of ESKD in children."},{"letter":"B","text":"Minimal change disease","correct":false,"expl":"Minimal change disease is nephrotic, presenting with edema and proteinuria, not polyuria and cysts."},{"letter":"C","text":"ADPKD","correct":false,"expl":"ADPKD causes huge kidneys in adults, not small cystic kidneys in a child."},{"letter":"D","text":"Acquired cystic disease","correct":false,"expl":"Acquired cystic disease occurs in dialysis patients, not as a primary pediatric cause."}],"nb":"Polyuria reflects an early medullary concentrating defect."}]}};
</script>
<script>
const DS_BLOCKS = {"27": "<h3 class=\"ds-chlabel\">Ch 27 — Disease Summary: Valvular/Endocardial Disease, Heart Failure & Circulatory Shock</h3>\n<div class=\"ds-section-label\">Endocardial & Valvular Disorders</div>\n<div class=\"ds-grid\">\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Infective Endocarditis</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Infection of the endocardium and heart valves.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Bacteria seed a valve (often previously damaged or via IV drug use), forming friable vegetations that destroy the valve and embolize.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Strep viridans (subacute, damaged valves, after dental work); Staph aureus (acute, MOST COMMON in IV drug users, attacks HEALTHY valves, tricuspid); also Staph epidermidis, Strep bovis (→ screen for colon cancer), HACEK organisms. Mitral, aortic, tricuspid most affected. Diagnosed by modified Duke criteria.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Prolonged IV antibiotics; valve surgery for destruction/failure.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Rheumatic Heart Disease</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Immune-mediated valve damage following streptococcal pharyngitis.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>MOLECULAR MIMICRY — the group A beta-hemolytic streptococcal M protein resembles human tissue, so antibodies cross-react with the heart, joints, skin, and brain, 2–3 weeks after the throat infection.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Acute phase (carditis, arthritis, chorea), then recurrent, then chronic phase — permanent valve deformity years later, classically MITRAL STENOSIS; antistreptolysin O antibodies, raised ESR/CRP.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Antibiotics for the strep, anti-inflammatories; valve surgery later. Prevention = treat strep throat.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Mitral Valve Disorders</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Stenosis, regurgitation, or prolapse of the mitral valve.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Mitral STENOSIS is almost always rheumatic — the narrowed valve blocks left atrial emptying, raising left atrial pressure and backing up into the lungs. Mitral REGURGITATION comes from ruptured chordae tendineae or prolapse, letting blood leak back into the atrium.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Stenosis — opening snap, dyspnea/orthopnea/PND, atrial fibrillation from the dilated atrium. Regurgitation — holosystolic murmur, dilated left atrium and ventricle. Prolapse — mid-systolic click with late systolic murmur.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Rate control and anticoagulation for atrial fibrillation; valve repair/replacement.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Aortic Valve Disorders</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Stenosis or regurgitation of the aortic valve.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Aortic STENOSIS from congenital bicuspid valve or acquired calcification obstructs left ventricular outflow, raising afterload and causing concentric hypertrophy. Aortic REGURGITATION (rheumatic, endocarditis, aortic root dilation, hypertension) allows backflow, causing volume overload.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Stenosis — crescendo-decrescendo systolic murmur; classic triad of angina, syncope, and heart failure; older men, hypercholesterolemia. Regurgitation — early diastolic decrescendo murmur, wide pulse pressure, LVH, dyspnea/orthopnea/PND.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Valve replacement (surgical or transcatheter) when symptomatic.</p></div>\n            </div>\n</div>\n<div class=\"ds-section-label\">Heart Failure</div>\n<div class=\"ds-grid\">\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Heart Failure with Reduced EF (Systolic Failure)</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>The heart cannot contract strongly enough to eject blood (EF &lt;40%).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Impaired myocardial contractility — most often from ischemic heart disease or cardiomyopathy; also volume overload (valve insufficiency) or pressure overload (aortic stenosis, hypertension) that eventually exhausts the ventricle.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Dyspnea, fatigue, orthopnea, paroxysmal nocturnal dyspnea, JVD, edema; S3 gallop (volume overload).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Diuretics (preload), ACE inhibitors (afterload), beta-blockers, digitalis; devices and transplant for advanced disease.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Heart Failure with Preserved EF (Diastolic Failure)</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>The heart contracts normally but cannot FILL (EF &gt;50%).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>A stiff or restricted ventricle limits diastolic filling — the leading cause is HYPERTENSION (via hypertrophy); also pericardial disease and hypertrophic cardiomyopathy.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Pulmonary congestion with a normal ejection fraction; S4 gallop (atrial kick into a stiff ventricle).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Control blood pressure and volume; treat the underlying stiffening process.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Left vs Right Ventricular Failure</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Which side fails determines where the fluid backs up.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>LEFT failure backs blood up into the pulmonary circulation; RIGHT failure backs it up into the systemic venous circulation. Right failure most often RESULTS from left failure; cor pulmonale is right failure from chronic lung disease.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Left — dyspnea, orthopnea, PND, crackles, pulmonary edema (frothy sputum), cardiac asthma. Right — peripheral edema, JVD, hepatomegaly, ascites, weight gain (2 lb in 24 h or 5 lb in a week signals worsening).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Diagnosis: BNP, ECG, echocardiogram, chest X-ray (ABCDE — Alveolar edema, Kerley B lines, Cardiomegaly, Dilated upper lobe vessels, Effusion).</p></div>\n            </div>\n</div>\n<div class=\"ds-section-label\">Circulatory Shock</div>\n<div class=\"ds-grid\">\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Shock — General Principles</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Acute circulatory failure causing inadequate tissue perfusion and cellular hypoxia.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Whatever the cause, oxygen delivery falls below cellular demand; the body compensates short-term via the sympathetic nervous system (tachycardia, vasoconstriction) and RAAS (salt/water retention).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Hypotension, tachycardia, cool clammy skin, altered mental status, low urine output, rising lactate.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Identify and treat the type — the compensation eventually fails.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Cardiogenic Shock</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Pump failure — the heart cannot deliver adequate output despite adequate volume.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Massive MI, arrhythmia, or end-stage cardiomyopathy leaves the ventricle unable to eject.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Hypotension and hypoperfusion WITH adequate intravascular volume (↑PCWP); cyanosis, confusion, low urine output.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Inotropes, revascularization, mechanical support — high mortality.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Hypovolemic &amp; Obstructive Shock</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Too little volume, or a mechanical block to flow.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Hypovolemic: loss of ≥15–20% of blood volume (hemorrhage, plasma or extracellular fluid loss) underfills the vascular compartment, dropping stroke volume. Obstructive: a mechanical block prevents filling or outflow — most commonly pulmonary embolism, also tamponade and tension pneumothorax.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Hypovolemic — tachycardia, vasoconstriction, flat neck veins, LOW PCWP. Obstructive — elevated right heart pressures with distended neck veins.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Hypovolemic: replace volume/blood, stop the loss. Obstructive: relieve the obstruction.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Distributive Shock (Septic, Anaphylactic, Neurogenic)</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Loss of vessel tone — the container gets too big for the volume.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Vasodilation enlarges the vascular compartment and displaces blood away from the central circulation. Septic: infection-driven cytokines and nitric oxide. Anaphylactic: IgE/mast-cell mediators. Neurogenic: loss of sympathetic tone (spinal injury).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Septic shock — sepsis with hypotension persisting DESPITE fluid resuscitation; fever, high WBC, acidosis, hypoxemia. Warm skin early ('warm shock').</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Septic: early antibiotics, fluids, vasopressors, source control. Anaphylactic: IM epinephrine.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Complications of Shock</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Organ failure resulting from prolonged hypoperfusion.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Sustained hypoxia plus inflammatory mediators injure multiple organ systems.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>ARDS (profound refractory hypoxemia within 12–48 h); acute renal failure from acute tubular necrosis; GI ulceration/bleeding from mucosal hypoperfusion; disseminated intravascular coagulation (widespread clotting that consumes factors → bleeding, common in septic shock); multiple organ dysfunction syndrome.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Restore perfusion early — MODS carries a high mortality once established.</p></div>\n            </div>\n</div>", "28": "<h3 class=\"ds-chlabel\">Ch 28 — Disease Summary: Cardiac Conduction &amp; Rhythm</h3>\n<div class=\"ds-section-label\">Mechanisms of Arrhythmia</div>\n<div class=\"ds-grid\">\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Ectopic Pacemakers, Altered Excitability &amp; Reentry</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>The three ways rhythm disorders arise.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>An ECTOPIC PACEMAKER is an excitable focus outside the SA node that fires prematurely (triggered by sympathetic excess, caffeine, ischemia). Altered EXCITABILITY/CONDUCTIVITY occurs when injured myocardium responds abnormally. REENTRY is a self-sustaining circuit in which an impulse continuously re-excites a region of the heart.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Reentry underlies most sustained tachyarrhythmias — it is why ablation (destroying the circuit) works. Common causes: ischemia and infarction, hypertrophy, electrolyte imbalance, drugs, congenital or degenerative conduction disease.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Treat the trigger; ablation for recurrent reentrant circuits.</p></div>\n            </div>\n</div>\n<div class=\"ds-section-label\">Arrhythmias of Atrial (Supraventricular) Origin</div>\n<div class=\"ds-grid\">\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Paroxysmal Supraventricular Tachycardia (PSVT)</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Sudden rapid rhythm originating above the bifurcation of the bundle of His.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>A reentry circuit in the SA node, atria, AV node, or junctional tissue captures the rhythm.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>ABRUPT onset and termination; rate 140–240 bpm; narrow QRS (supraventricular origin).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Vagal maneuvers, adenosine; ablation for recurrent cases.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Atrial Flutter</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>A rapid, mostly REGULAR atrial ectopic tachycardia.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>A large reentry circuit in the atrium fires at 240–340 bpm; the AV node blocks most impulses, so the ventricles beat slower than the atria.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Regular 'sawtooth' flutter waves; atrial rate far exceeds ventricular rate.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Rate control, anticoagulation, cardioversion, ablation.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Atrial Fibrillation</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Rapid, IRREGULAR, unsynchronized atrial contraction — the most common sustained arrhythmia.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Chaotic multiple reentry wavelets fire at 400–600 bpm, so the atria quiver rather than contract; the AV node conducts irregularly.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Irregularly irregular rhythm with NO discernible P waves; loss of the atrial kick reduces cardiac output ~20%; stasis in the fibrillating atrium forms clots.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Rate or rhythm control PLUS anticoagulation — the major risk is embolic stroke. Common in mitral stenosis, heart failure, and hyperthyroidism.</p></div>\n            </div>\n</div>\n<div class=\"ds-section-label\">Ventricular Arrhythmias</div>\n<div class=\"ds-grid\">\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Premature Ventricular Contractions (PVCs)</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Early beats arising from an ectopic ventricular focus.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>An irritable ventricular focus depolarizes before the next sinus impulse arrives.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Wide, bizarre QRS with a compensatory pause; often benign but frequent PVCs may signal ischemia or electrolyte disturbance.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Usually observation; treat the underlying cause (ischemia, low potassium/magnesium).</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Ventricular Tachycardia</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>A rapid rhythm (70–250 bpm) originating below the bundle of His.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>A ventricular reentry circuit or ectopic focus drives the ventricles independently of the atria.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>WIDE QRS tachycardia; dangerous because it eliminates the atrial kick and shortens diastolic filling, so cardiac output collapses; can degenerate into ventricular fibrillation.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Pulseless VT → immediate defibrillation; stable VT → antiarrhythmics or synchronized cardioversion; ICD for recurrent risk.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Ventricular Flutter &amp; Fibrillation</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Chaotic ventricular activity with no effective contraction — cardiac arrest.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Completely disorganized electrical activity means the ventricles quiver instead of pumping, so cardiac output is ZERO.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Flutter shows large oscillations; fibrillation shows totally disorganized waveforms. RAPIDLY FATAL if not reversed.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Immediate DEFIBRILLATION (unsynchronized) plus CPR — every minute of delay reduces survival.</p></div>\n            </div>\n</div>\n<div class=\"ds-section-label\">Disorders of AV Conduction (Heart Block)</div>\n<div class=\"ds-grid\">\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">First-Degree AV Block</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Delayed but complete AV conduction.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Conduction through the AV node is slowed, but every atrial impulse still reaches the ventricles.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>PROLONGED PR interval (&gt;0.20 s), with every P wave followed by a QRS.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Usually benign; observe and review medications (beta-blockers, calcium channel blockers, digoxin).</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Second-Degree AV Block</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Intermittent failure of conduction — some atrial impulses do not reach the ventricles.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Progressive AV nodal fatigue (Mobitz I/Wenckebach, PR lengthens until a beat drops) or abrupt infranodal failure (Mobitz II, sudden dropped beats).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Some P waves are NOT followed by a QRS. Mobitz II is more dangerous — it can progress to complete block.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Mobitz I often observed; Mobitz II usually requires a pacemaker.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Third-Degree (Complete) AV Block</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Total interruption of AV conduction — atria and ventricles beat independently.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Conduction is blocked at the AV node, bundle of His, or Purkinje system, so a separate escape pacemaker below the block drives the ventricles at its own slow intrinsic rate.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>AV DISSOCIATION — P waves and QRS complexes march independently; slow ventricular rate causes syncope and heart failure.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Requires a PERMANENT PACEMAKER.</p></div>\n            </div>\n</div>\n<div class=\"ds-section-label\">Diagnosis &amp; Treatment Concepts</div>\n<div class=\"ds-grid\">\n<div class=\"ds-card ds-card-note\">\n              <h4 class=\"ds-name\">Diagnostic Methods</h4>\n              <p>Intermittent arrhythmias require prolonged or provoked monitoring to be caught. Surface ECG (snapshot), Holter monitor (24–48 h), implantable loop recorder (long-term), exercise stress testing (provocation), electrophysiologic studies (mapping).</p>\n            </div>\n<div class=\"ds-card ds-card-note\">\n              <h4 class=\"ds-name\">Antiarrhythmic Drug Classes</h4>\n              <p>Class I blocks fast SODIUM channels (phase 0). Class II are BETA-BLOCKERS, blunting sympathetic drive. Class III blocks POTASSIUM current, extending the action potential and refractoriness. Class IV blocks slow CALCIUM channels, depressing the node.</p>\n            </div>\n<div class=\"ds-card ds-card-note\">\n              <h4 class=\"ds-name\">Device &amp; Procedural Therapy</h4>\n              <p>Pacemakers supply impulses when the intrinsic rate is too slow; cardioversion/defibrillation reset chaotic rhythms; ablation destroys the arrhythmogenic tissue or circuit. CARDIOVERSION is SYNCHRONIZED to the R wave (for organized rhythms like atrial fibrillation or stable VT); DEFIBRILLATION is UNSYNCHRONIZED (for ventricular fibrillation/pulseless VT, where there is no R wave to sync to) — that distinction is critical. Pacemakers (temporary/permanent), implantable cardioverter-defibrillators, radiofrequency ablation, and surgical options.</p>\n            </div>\n</div>", "30": "<h3 class=\"ds-chlabel\">Ch 30 — Disease Summary: Respiratory Tract Infections, Neoplasms &amp; Childhood Disorders</h3>\n<div class=\"ds-section-label\">Upper Respiratory Infections</div>\n<div class=\"ds-grid\">\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Common Cold</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Viral infection of the upper respiratory tract.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Rhinoviruses (most common), plus parainfluenza, RSV, coronaviruses, adenoviruses; spread by direct contact — the FINGERS are the greatest source, entering via the nasal and conjunctival mucosa.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Sore/scratchy throat, watery rhinorrhea, congestion, sneezing; self-limited in 7–10 days.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Supportive — antihistamines, decongestants; NO antibiotics (viral).</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Rhinosinusitis</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Inflammation of the nasal mucosa and paranasal sinuses.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Blockage of the sinus ostia traps mucus in the sinuses, which then becomes infected. Acute is often viral (or H. influenzae, S. pneumoniae); chronic (&gt;12 weeks) involves anaerobes, Staph, or Pseudomonas.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Facial pain/pressure, purulent discharge, congestion; bacterial suggested if &gt;10 days or worsening.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Decongestants, saline, antibiotics for bacterial; watch for CNS extension (meningitis, brain abscess).</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Influenza</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Acute respiratory infection by an RNA virus (types A, B, C).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Type A is most common and severe, infects multiple species, and drifts/shifts via its surface antigens hemagglutinin (H) and neuraminidase (N) — which is why the vaccine is reformulated yearly.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Abrupt fever, chills, myalgias, headache, dry cough; the dangerous sequence is viral pneumonia or a SECONDARY bacterial pneumonia (Staph aureus).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Antivirals within ~48 h; annual vaccine (inactivated injection or live intranasal for healthy non-pregnant patients).</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Pneumonia</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Inflammation of the alveoli and bronchioles.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Infectious (bacteria, viruses) or non-infectious (aspirated gastric secretions). Classified by agent, by distribution (LOBAR = consolidation of a whole lobe vs BRONCHOPNEUMONIA = patchy, multi-lobar), and by setting.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Community-acquired (onset outside hospital or &lt;48 h after admission) vs hospital-acquired (&gt;48 h, 90% bacterial, 20–50% mortality — Pseudomonas, Klebsiella, Staph).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Empiric antibiotics guided by the setting and likely organisms.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Pneumococcal (Typical) Pneumonia</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>The most common bacterial pneumonia.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Streptococcus pneumoniae (gram-positive encapsulated diplococcus) colonizes the nasopharynx,
