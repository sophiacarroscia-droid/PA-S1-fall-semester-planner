<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathophysiology II · Chapter Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea;
  --paper:#fffdf8;
  --ink:#2b241f;
  --muted:#8a8177;
  --line:#3b372f;
  --sidebar:#ece4d4;
  --dark-chip:#524433;
  --dark-chip-2:#3d3326;
  --timer-bg:#524433;
  --todo-outline:#401F28;
  --font-brand:'Cormorant Garamond','Source Serif 4',serif;
  --font-script:'Snell Roundhand','Pinyon Script',cursive;
  --pink-light:#fdf1ef;
  --exam-bg:#ece4d8;
  --c-patho:#896A67;
  --c-clm:#A28A87;
  --c-handp:#BBA9A7;
  --c-acm:#D4C9C7;
  --c-dti:#EDE8E6;
  --taupe1:#C4C2B9;
  --taupe2:#D6D7D1;
  --dark1:#645A4E;
  --taupe3:#D8D1D0;
  --dark2:#5D5A4F;
  --mauve:#B89D93;
  --good:#6B8F71;
  --good-bg:#e7ede6;
  --bad:#A85C4D;
  --bad-bg:#f3e4e0;
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;margin:0;padding:0 0 60px;}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 10px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);}
h1.pagehead{font-family:var(--font-brand);font-size:30px;font-weight:500;letter-spacing:.02em;margin:4px 0 2px 0;}
.verse{font-family:'Source Serif 4',serif;font-style:italic;font-size:13.5px;color:var(--dark-chip);margin:2px 0 16px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:0;padding:16px 18px;margin-bottom:16px;}
.card h3{font-family:'Source Serif 4',serif;font-style:italic;font-weight:600;font-size:18px;margin:0 0 10px 0;}
.card h4{font-size:12.5px;margin:14px 0 6px;color:var(--dark1);text-transform:uppercase;letter-spacing:.04em;font-family:'IBM Plex Mono',monospace;}
button.btn{font-family:'IBM Plex Sans';font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:22px;border:1px solid var(--dark1);background:var(--dark1);color:#fff;cursor:pointer;}
button.btn.ghost{background:transparent;color:var(--dark1);}
button.btn:hover{opacity:.88;}
input,select,textarea{font-family:'IBM Plex Sans';font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);width:100%;}
label{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px;}

/* ===== top overview ===== */
.overview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.stat-box{background:var(--paper);border:1px solid var(--line);padding:14px 16px;text-align:center;}
.stat-box .num{font-family:var(--font-brand);font-size:30px;color:var(--dark-chip);font-weight:600;}
.stat-box .lbl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:2px;}

/* ===== pomodoro ===== */
.pomodoro{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);padding:14px 18px;margin-bottom:16px;position:sticky;top:0;z-index:50;}
.pomo-digits{display:flex;align-items:center;gap:6px;}
.pomo-digits .d{background:var(--exam-bg);color:var(--timer-bg);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:28px;padding:8px 12px;border-radius:20px;min-width:52px;text-align:center;}
.pomo-btns{display:flex;gap:6px;flex-wrap:wrap;}
.pomo-btns button{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 12px;border-radius:16px;border:1px solid var(--todo-outline);background:transparent;color:var(--todo-outline);cursor:pointer;}
.pomo-btns button.active{background:var(--todo-outline);color:#fff;}
.pomo-start{font-family:'IBM Plex Sans';font-weight:700;font-size:12.5px;padding:8px 18px;border-radius:20px;border:1px solid var(--dark1);background:var(--exam-bg);color:var(--timer-bg);cursor:pointer;}
.pomo-meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.6;}

/* ===== tabs ===== */
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.tabbar button{font-family:'IBM Plex Sans';font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:20px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;}
.tabbar button.active{background:var(--dark-chip);color:#fff;border-color:var(--dark-chip);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ===== progress ===== */
.progress-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.progress-track{flex:1;height:10px;background:var(--taupe2);border-radius:8px;overflow:hidden;}
.progress-fill{height:100%;background:var(--dark1);border-radius:8px;transition:width .3s;}
.progress-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;}

/* ===== disease summary ===== */
.ds-toggle{margin-bottom:10px;}
.ds-wrap{display:none;}
.ds-wrap.open{display:block;}
.ds-chlabel{font-family:var(--font-brand);font-size:20px;font-weight:500;color:var(--dark-chip);margin:4px 0 12px;}
.ds-section-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#fff;background:var(--c-patho);display:inline-block;padding:5px 12px;border-radius:14px;margin:14px 0 10px;}
.ds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:6px;}
.ds-card{background:var(--pink-light);border:1px solid var(--line);border-radius:16px;padding:13px 15px;}
.ds-card-note{background:var(--taupe2);}
.ds-name{font-family:'Source Serif 4',serif;font-style:italic;font-weight:600;color:var(--dark-chip);font-size:14.5px;margin:0 0 8px;text-transform:none;letter-spacing:0;}
.ds-row{margin-bottom:7px;}
.ds-row:last-child{margin-bottom:0;}
.ds-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--dark1);background:#fff;border:1px solid var(--taupe3);border-radius:8px;padding:2px 7px;margin-bottom:3px;}
.ds-row p{margin:3px 0 0;font-size:12px;line-height:1.55;color:var(--ink);}
.ds-missing p{font-size:12.5px;line-height:1.6;}

/* ===== quiz ===== */
.quiz-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.quiz-toolbar .filter-chip{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;}
.quiz-toolbar .filter-chip.active{background:var(--dark1);color:#fff;border-color:var(--dark1);}
.qitem{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;}
.qitem-head{display:flex;align-items:flex-start;gap:10px;padding:13px 16px;cursor:pointer;}
.qitem-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#fff;background:var(--c-patho);border-radius:50%;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.qitem-num.correct{background:var(--good);}
.qitem-num.wrong{background:var(--bad);}
.qitem-stem{font-size:13.5px;line-height:1.5;flex:1;}
.qitem-status{font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap;padding-top:3px;}
.qitem-body{display:none;padding:0 16px 16px;}
.qitem-body.open{display:block;}
.opt-btn{display:block;width:100%;text-align:left;font-family:'IBM Plex Sans';font-size:12.5px;padding:9px 13px;margin-bottom:7px;border-radius:12px;border:1px solid var(--taupe3);background:#fff;cursor:pointer;line-height:1.5;}
.opt-btn:hover{border-color:var(--dark1);}
.opt-btn.disabled{cursor:default;}
.opt-btn .lt{font-weight:700;margin-right:6px;}
.opt-btn.pick-correct{background:var(--good-bg);border-color:var(--good);}
.opt-btn.pick-wrong{background:var(--bad-bg);border-color:var(--bad);}
.opt-btn.reveal-correct{border-color:var(--good);}
.opt-expl{font-size:11.5px;color:var(--dark1);margin-top:4px;line-height:1.5;}
.qitem-nb{margin-top:10px;font-size:11.5px;font-style:italic;color:var(--dark1);background:var(--taupe2);padding:8px 12px;border-radius:10px;}
.qitem-verdict{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;padding:6px 12px;border-radius:10px;display:inline-block;}
.qitem-verdict.correct{background:var(--good-bg);color:var(--good);}
.qitem-verdict.wrong{background:var(--bad-bg);color:var(--bad);}

/* ===== notes/scratchpad ===== */
.notes-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;}
.notes-box textarea{min-height:160px;resize:vertical;font-size:12.5px;line-height:1.5;}
.paste-zone{min-height:160px;border:2px dashed var(--taupe3);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:#fff;}
.paste-zone.dragover{border-color:var(--dark1);background:var(--pink-light);}
.paste-zone .hint{width:100%;text-align:center;color:var(--muted);font-size:11.5px;font-family:'IBM Plex Mono',monospace;padding:20px 0;}
.paste-thumb{position:relative;width:100px;height:100px;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
.paste-thumb img{width:100%;height:100%;object-fit:cover;}
.paste-thumb .rm{position:absolute;top:2px;right:2px;background:rgba(43,36,31,.75);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;line-height:1;}

/* ===== weak topics ===== */
.weak-chapter-label{font-family:var(--font-brand);font-size:18px;color:var(--dark-chip);margin:18px 0 8px;}

@media(max-width:800px){
  .overview-grid{grid-template-columns:repeat(2,1fr);}
  .notes-grid{grid-template-columns:1fr;}
  .pomo-meta{margin-left:0;text-align:left;width:100%;}
}
</style>
</head>

<script>
const QBUNDLE = {"titles":{"27":"Ch 27 — Valvular/Endocardial Disease, Heart Failure & Shock","28":"Ch 28 — Cardiac Conduction & Rhythm (EKG)","30":"Ch 30 — Respiratory Infections, Neoplasms & Childhood Disorders","31":"Ch 31 — Disorders of Ventilation & Gas Exchange","33":"Ch 33 — Disorders of Renal Function"},"short":{"27":"Ch 27","28":"Ch 28","30":"Ch 30","31":"Ch 31","33":"Ch 33"},"chapters":{"27":[{"num":1,"stem":"Which contrast best distinguishes acute from subacute infective endocarditis?","options":[{"letter":"A","text":"Acute IE affects only the right heart; subacute only the left","correct":false,"expl":"Side of the heart is not what defines acute vs subacute."},{"letter":"B","text":"Acute IE is always viral; subacute IE is always fungal","correct":false,"expl":"IE is bacterial in these cases; the acute/subacute split is by virulence and valve status, not viral vs fungal."},{"letter":"C","text":"Acute IE strikes healthy valves with a virulent organism; subacute IE smolders on already-damaged valves with a less virulent organism","correct":true,"expl":"Correct. Acute IE is an aggressive infection of healthy valves (e.g., Staph. aureus); subacute IE is an indolent infection of previously damaged valves (e.g., Strep. viridans)."},{"letter":"D","text":"Acute IE never embolizes; subacute always does","correct":false,"expl":"Both forms can embolize; that does not separate them."}],"nb":"Classification is by etiology, onset, and severity."},{"num":2,"stem":"The Jones criteria used for rheumatic fever include which of the following major features?","options":[{"letter":"A","text":"Fever, cough, night sweats, and weight loss","correct":false,"expl":"That tetrad describes tuberculosis, not rheumatic fever."},{"letter":"B","text":"Carditis, migratory polyarthritis, subcutaneous nodules, erythema marginatum, and Sydenham chorea","correct":true,"expl":"Correct. Jones major criteria are carditis, migratory polyarthritis (Joints), subcutaneous Nodules, Erythema marginatum, and Sydenham chorea."},{"letter":"C","text":"Ptosis, miosis, and anhidrosis","correct":false,"expl":"Ptosis/miosis/anhidrosis is Horner syndrome."},{"letter":"D","text":"Facial swelling and distended neck veins","correct":false,"expl":"Facial swelling and distended neck veins describe SVC syndrome."}],"nb":"Mnemonic JONES: Joints, Oheart (carditis), Nodules, Erythema marginatum, Sydenham chorea."},{"num":3,"stem":"What is the recommended long-term prophylaxis to prevent recurrent rheumatic fever?","options":[{"letter":"A","text":"A one-time dose of oral aspirin","correct":false,"expl":"Aspirin treats inflammation acutely; it is not recurrence prophylaxis."},{"letter":"B","text":"Monthly benzathine penicillin","correct":true,"expl":"Correct. Recurrences are prevented with monthly benzathine penicillin prophylaxis."},{"letter":"C","text":"Lifelong daily antiviral therapy","correct":false,"expl":"Rheumatic fever follows a bacterial (streptococcal) trigger, so antivirals are irrelevant."},{"letter":"D","text":"No prophylaxis is ever indicated","correct":false,"expl":"Prophylaxis is indicated because recurrences worsen valve damage."}],"nb":"Each recurrence adds to permanent valve deformity, classically mitral stenosis."},{"num":4,"stem":"Which serologic tests support a diagnosis of rheumatic heart disease by documenting a preceding streptococcal infection?","options":[{"letter":"A","text":"Troponin and CK-MB","correct":false,"expl":"Troponin/CK-MB mark myocardial injury, not streptococcal antibodies."},{"letter":"B","text":"D-dimer and fibrinogen","correct":false,"expl":"D-dimer/fibrinogen assess coagulation/thromboembolism, not streptococcal exposure."},{"letter":"C","text":"Antistreptolysin O and anti-deoxyribonuclease B","correct":true,"expl":"Correct. Antistreptolysin O (ASO) and anti-DNase B document prior group A streptococcal infection."},{"letter":"D","text":"BNP and NT-proBNP","correct":false,"expl":"BNP reflects heart-failure wall stress, not streptococcal infection."}],"nb":"Work-up also includes WBC, ESR, C-reactive protein, and echocardiography."},{"num":5,"stem":"What is the mainstay of therapy for infective endocarditis, and when is early surgery indicated?","options":[{"letter":"A","text":"Anticoagulation only; surgery for any positive blood culture","correct":false,"expl":"Anticoagulation is not the mainstay and can be hazardous; surgery is reserved for specific complications."},{"letter":"B","text":"A single oral antibiotic dose; surgery is never needed","correct":false,"expl":"A single oral dose cannot eradicate valvular infection."},{"letter":"C","text":"4–6 weeks of IV bactericidal antibiotics; surgery for heart failure, abscess, or large vegetations","correct":true,"expl":"Correct. IE requires a prolonged course (4–6 weeks) of IV bactericidal antibiotics, with early surgery for heart failure, abscess, or large vegetations."},{"letter":"D","text":"Antiviral therapy; surgery for fever alone","correct":false,"expl":"IE is bacterial, so antivirals do not treat it."}],"nb":"Surgical indications center on hemodynamic compromise and uncontrolled/destructive infection."},{"num":6,"stem":"Valvular dysfunction can arise from all of the following mechanisms EXCEPT:","options":[{"letter":"A","text":"Ischemic or degenerative changes","correct":false,"expl":"Ischemic and degenerative changes are listed causes."},{"letter":"B","text":"Inflammation","correct":false,"expl":"Inflammation (e.g., rheumatic, infective) is a listed cause."},{"letter":"C","text":"Congenital defects","correct":false,"expl":"Congenital defects are a listed cause of valve disease."},{"letter":"D","text":"Increased surfactant production","correct":true,"expl":"Correct. Surfactant is a pulmonary substance and has nothing to do with valve dysfunction."}],"nb":"Listed causes: congenital, trauma, ischemic damage, degenerative changes, and inflammation."},{"num":7,"stem":"According to the material, symptomatic aortic stenosis (or a valve area under about 1 cm²) is best managed with:","options":[{"letter":"A","text":"Lifelong observation only","correct":false,"expl":"Observation is inappropriate once AS is symptomatic; outcomes worsen sharply."},{"letter":"B","text":"Balloon valvotomy of the mitral valve","correct":false,"expl":"Balloon valvotomy of the mitral valve treats mitral stenosis, not aortic stenosis."},{"letter":"C","text":"A vasodilator to relieve the obstruction","correct":false,"expl":"Vasodilators do not relieve a fixed valvular obstruction and can be dangerous in severe AS."},{"letter":"D","text":"Valve replacement (TAVI or SAVR)","correct":true,"expl":"Correct. Symptomatic severe AS (valve <1 cm²) is treated by valve replacement - transcatheter (TAVI) or surgical (SAVR)."}],"nb":"The AS symptom triad is syncope, angina, and dyspnea."},{"num":8,"stem":"Which intervention is used to relieve rheumatic mitral stenosis?","options":[{"letter":"A","text":"Pacemaker insertion","correct":false,"expl":"A pacemaker treats bradyarrhythmias/block, not valve obstruction."},{"letter":"B","text":"Coronary artery bypass grafting","correct":false,"expl":"CABG treats coronary artery disease, not a stenotic mitral valve."},{"letter":"C","text":"Pericardiocentesis","correct":false,"expl":"Pericardiocentesis drains a pericardial effusion/tamponade, unrelated to MS."},{"letter":"D","text":"Balloon valvotomy","correct":true,"expl":"Correct. Mitral stenosis, commonly rheumatic, is relieved by balloon valvotomy."}],"nb":"MS dilates the left atrium, predisposing to atrial fibrillation and hemoptysis."},{"num":9,"stem":"Which of the following is a recognized cause of aortic regurgitation?","options":[{"letter":"A","text":"Emphysema","correct":false,"expl":"Emphysema is a lung disease and not a listed AR cause."},{"letter":"B","text":"Infective endocarditis","correct":true,"expl":"Correct. AR causes include rheumatic fever, idiopathic aortic dilation, infective endocarditis, congenital abnormalities, and hypertension."},{"letter":"C","text":"Hypokalemia","correct":false,"expl":"Hypokalemia is an electrolyte disturbance, not a cause of AR."},{"letter":"D","text":"Iron-deficiency anemia","correct":false,"expl":"Iron-deficiency anemia does not cause aortic regurgitation."}],"nb":"AR produces a wide pulse pressure and an early diastolic decrescendo murmur."},{"num":10,"stem":"In valvular disease, the difference between stenosis and regurgitation is best described as:","options":[{"letter":"A","text":"Stenosis = the valve fails to open fully (obstruction); regurgitation = the valve fails to close (backflow)","correct":true,"expl":"Correct. A stenotic valve does not open fully and obstructs forward flow; an incompetent/regurgitant valve does not close and allows backflow."},{"letter":"B","text":"Both refer only to congenital valves","correct":false,"expl":"Both can be acquired, not only congenital."},{"letter":"C","text":"Both mean the valve is completely absent","correct":false,"expl":"Neither term means the valve is absent."},{"letter":"D","text":"Stenosis = backflow; regurgitation = obstruction","correct":false,"expl":"This reverses the two definitions."}],"nb":"The two disorder types most often affect the mitral and aortic valves."},{"num":11,"stem":"Chronic mitral regurgitation produces which structural consequence?","options":[{"letter":"A","text":"Right atrial calcification","correct":false,"expl":"Right atrial calcification is not the MR consequence described."},{"letter":"B","text":"A thick, small left ventricle from pressure overload","correct":false,"expl":"Thick, small pressure-overloaded ventricle is the pattern of aortic stenosis/hypertension, not MR."},{"letter":"C","text":"Aortic root aneurysm","correct":false,"expl":"Aortic root aneurysm relates to aortic disease, not mitral regurgitation."},{"letter":"D","text":"A dilated left atrium and left ventricle from volume overload","correct":true,"expl":"Correct. Regurgitant flow volume-overloads and dilates both the left atrium and left ventricle, predisposing to atrial fibrillation."}],"nb":"MR can result from ruptured chordae tendineae or mitral valve prolapse."},{"num":12,"stem":"What is the core mechanical difference between systolic and diastolic heart failure?","options":[{"letter":"A","text":"Systolic failure is impaired filling; diastolic failure is impaired contraction","correct":false,"expl":"This reverses the definitions."},{"letter":"B","text":"Both are defined by a low ejection fraction","correct":false,"expl":"Only systolic failure has a reduced EF; diastolic failure has a preserved EF."},{"letter":"C","text":"Both are defined by valve destruction","correct":false,"expl":"Valve destruction is not the defining feature of either category."},{"letter":"D","text":"Systolic failure is impaired contraction/emptying; diastolic failure is impaired relaxation/filling","correct":true,"expl":"Correct. Systolic (HFrEF) failure is impaired contractility and emptying (low EF); diastolic (HFpEF) failure is impaired relaxation/filling with preserved EF."}],"nb":"HFrEF <40%; HFpEF ≥50%."},{"num":13,"stem":"Which pairing of overload type and cause of systolic (reduced-EF) failure is correct?","options":[{"letter":"A","text":"Neither overload type contributes to systolic failure","correct":false,"expl":"Both overload types do contribute to systolic failure."},{"letter":"B","text":"Pressure overload","correct":false,"expl":"anemia; volume overload - hypertension - Anemia is a high-output/hypermetabolic contributor, not the pressure/volume pairing described."},{"letter":"C","text":"Pressure overload","correct":true,"expl":"aortic stenosis or hypertension; volume overload - valvular insufficiency - Correct. Pressure overload (aortic stenosis, hypertension) and volume overload (valvular insufficiency) both drive systolic dysfunction."},{"letter":"D","text":"Pressure overload","correct":false,"expl":"mitral regurgitation; volume overload - aortic stenosis - This mismatches the examples - MR is volume overload and AS is pressure overload."}],"nb":"Ischemic heart disease and cardiomyopathy are the most common causes of HFrEF."},{"num":14,"stem":"A heart-failure patient wakes abruptly at night gasping for breath, relieved after sitting upright for several minutes. This symptom is:","options":[{"letter":"A","text":"Pulsus alternans","correct":false,"expl":"Pulsus alternans is an alternating pulse amplitude, a physical sign rather than a symptom."},{"letter":"B","text":"Cheyne-Stokes respiration","correct":false,"expl":"Cheyne-Stokes is a cyclic crescendo-decrescendo breathing pattern, not acute nocturnal dyspnea."},{"letter":"C","text":"Paroxysmal nocturnal dyspnea","correct":true,"expl":"Correct. Sudden nighttime breathlessness that forces the patient upright is paroxysmal nocturnal dyspnea (PND)."},{"letter":"D","text":"Orthopnea","correct":false,"expl":"Orthopnea is breathlessness on lying flat that is relieved by sitting up, but it is not the abrupt nocturnal awakening described."}],"nb":"Left-sided failure also causes cardiac asthma and, when severe, acute pulmonary edema."},{"num":15,"stem":"Which pharmacologic agents are used in the treatment of heart failure?","options":[{"letter":"A","text":"Bronchodilators and inhaled steroids","correct":false,"expl":"Bronchodilators and inhaled steroids treat obstructive airway disease."},{"letter":"B","text":"Diuretics, ACE inhibitors, beta blockers, and digitalis","correct":true,"expl":"Correct. HF pharmacotherapy includes diuretics, ACE inhibitors, beta blockers, and digitalis."},{"letter":"C","text":"Isoniazid, rifampin, pyrazinamide, and ethambutol","correct":false,"expl":"RIPE is the tuberculosis regimen, not heart-failure therapy."},{"letter":"D","text":"Antihistamines and decongestants","correct":false,"expl":"Antihistamines/decongestants treat the common cold."}],"nb":"Non-drug measures include salt/fluid restriction, weight management, and exercise tolerance programs."},{"num":16,"stem":"A patient becomes hypotensive with warm, flushed skin immediately after a spinal cord injury, from loss of sympathetic vascular tone. Which shock subtype is this?","options":[{"letter":"A","text":"Cardiogenic shock","correct":false,"expl":"Cardiogenic shock is pump failure with cold skin, not warm vasodilation from lost tone."},{"letter":"B","text":"Obstructive shock","correct":false,"expl":"Obstructive shock results from a mechanical block such as PE."},{"letter":"C","text":"Hypovolemic shock","correct":false,"expl":"Hypovolemic shock follows volume loss with cold, vasoconstricted skin."},{"letter":"D","text":"Neurogenic (distributive) shock","correct":true,"expl":"Correct. Neurogenic shock is a distributive shock from loss of sympathetic tone (e.g., spinal cord injury), causing vasodilation."}],"nb":"Distributive shock also includes anaphylactic and septic subtypes."},{"num":17,"stem":"Which hemodynamic difference separates cardiogenic from hypovolemic shock?","options":[{"letter":"A","text":"Cardiogenic shock has low SVR; hypovolemic has high SVR","correct":false,"expl":"Both cardiogenic and hypovolemic shock have HIGH SVR (compensatory vasoconstriction)."},{"letter":"B","text":"Both have low filling pressures","correct":false,"expl":"Only hypovolemic shock has a low filling pressure; cardiogenic is high."},{"letter":"C","text":"Both have high cardiac output","correct":false,"expl":"Both are low-output states, not high output."},{"letter":"D","text":"Cardiogenic shock has HIGH filling pressure (↑PCWP); hypovolemic shock has LOW filling pressure (↓PCWP)","correct":true,"expl":"Correct. In cardiogenic shock the failing pump backs up, raising PCWP; in hypovolemic shock there is too little volume, so PCWP is low. Both have low output and high SVR."}],"nb":"Distributive (septic) shock is the low-SVR, high-output exception."},{"num":18,"stem":"Multiple organ dysfunction syndrome (MODS) as a complication of shock is best defined as:","options":[{"letter":"A","text":"A benign, self-limited process","correct":false,"expl":"MODS is severe with high mortality, not benign."},{"letter":"B","text":"A reversible injury limited to the kidney","correct":false,"expl":"That describes acute tubular necrosis, a single-organ (renal) complication."},{"letter":"C","text":"Altered function of two or more organ systems such that homeostasis cannot be maintained without intervention","correct":true,"expl":"Correct. MODS is failure of multiple organ systems (kidneys, lungs, liver, brain, heart) such that homeostasis cannot be maintained without intervention; mortality is high."},{"letter":"D","text":"Isolated failure of the lungs only","correct":false,"expl":"Isolated lung failure describes ARDS, not MODS."}],"nb":"The shock complication ladder runs ARDS → ATN → GI ischemia → DIC → MODS."},{"num":19,"stem":"Which statement about the acute renal complication of shock is correct?","options":[{"letter":"A","text":"The kidneys are never affected by shock","correct":false,"expl":"The kidney is a common shock target (decreased urine output is an early sign)."},{"letter":"B","text":"Renal injury in shock is due to a viral infection","correct":false,"expl":"ATN in shock is ischemic, not viral."},{"letter":"C","text":"Acute tubular necrosis is always permanent","correct":false,"expl":"ATN is characteristically reversible, not always permanent."},{"letter":"D","text":"Acute tubular necrosis from hypoperfusion is reversible, though recovery may take weeks to months","correct":true,"expl":"Correct. Acute tubular necrosis follows hypoxia/impaired renal perfusion and is reversible, though recovery can take weeks to months."}],"nb":"Decreased urine output and altered mental status are early sentinels of hypoperfusion."},{"num":20,"stem":"Through the renin-angiotensin system, the body compensates for the hypoperfusion of shock by:","options":[{"letter":"A","text":"Lowering systemic vascular resistance","correct":false,"expl":"Compensation raises SVR (vasoconstriction), it does not lower it."},{"letter":"B","text":"Causing vasodilation and diuresis","correct":false,"expl":"Vasodilation and diuresis would worsen hypoperfusion, the opposite of compensation."},{"letter":"C","text":"Slowing the heart rate","correct":false,"expl":"The compensatory sympathetic response raises, not lowers, heart rate."},{"letter":"D","text":"Causing vasoconstriction and retaining sodium and water","correct":true,"expl":"Correct. Increased renin release drives vasoconstriction and sodium/water retention to defend perfusion."}],"nb":"The sympathetic nervous system provides the other arm of short-term compensation."},{"num":21,"stem":"Three weeks after a dental cleaning, a patient with a previously abnormal (rheumatic) mitral valve develops low-grade fever, fatigue, and a new regurgitant murmur, with small embolic skin lesions. Which organism and IE category best fit?","options":[{"letter":"A","text":"Staphylococcus aureus","correct":false,"expl":"acute endocarditis of a healthy valve - Staph. aureus causes an acute, aggressive infection of healthy valves, not this subacute picture on a damaged valve."},{"letter":"B","text":"Coxsackievirus B","correct":false,"expl":"viral endocarditis - The listed IE organisms are bacterial; viral endocarditis is not the described entity."},{"letter":"C","text":"Mycobacterium tuberculosis","correct":false,"expl":"granulomatous valvulitis - TB does not cause this valvular endocarditis picture."},{"letter":"D","text":"Streptococcus viridans","correct":true,"expl":"subacute infective endocarditis - Correct. An indolent course on a previously damaged valve after a dental/oral source points to Strep. viridans subacute endocarditis."}],"nb":"Oral-cavity flora (viridans, HACEK) seed abnormal valves during transient bacteremia."},{"num":22,"stem":"A 9-year-old develops migratory joint pain, a new murmur, subcutaneous nodules, and involuntary movements about two weeks after a sore throat. What is the diagnosis?","options":[{"letter":"A","text":"Acute rheumatic fever","correct":true,"expl":"Correct. Migratory polyarthritis, carditis, subcutaneous nodules, and chorea two weeks after streptococcal pharyngitis are Jones criteria for acute rheumatic fever."},{"letter":"B","text":"Kawasaki disease","correct":false,"expl":"Kawasaki disease is a childhood vasculitis with different features and is not the post-strep syndrome described."},{"letter":"C","text":"Infective endocarditis","correct":false,"expl":"IE presents with persistent fever and vegetations, not this post-streptococcal Jones constellation."},{"letter":"D","text":"Cardiac tamponade","correct":false,"expl":"Tamponade presents with Beck's triad, not migratory arthritis and chorea."}],"nb":"Molecular mimicry between streptococcal M protein and human tissue drives the reaction."},{"num":23,"stem":"A 78-year-old with a harsh systolic crescendo-decrescendo murmur now has exertional syncope and a valve area of 0.8 cm². What is the appropriate management?","options":[{"letter":"A","text":"Continued observation with no intervention","correct":false,"expl":"Observation is unsafe once severe AS is symptomatic."},{"letter":"B","text":"A trial of a potent vasodilator","correct":false,"expl":"Vasodilators are hazardous in severe fixed AS."},{"letter":"C","text":"Aortic valve replacement (TAVI or SAVR)","correct":true,"expl":"Correct. Symptomatic severe aortic stenosis (valve <1 cm²) warrants valve replacement."},{"letter":"D","text":"Balloon valvotomy of the mitral valve","correct":false,"expl":"Balloon valvotomy addresses mitral stenosis, not aortic stenosis."}],"nb":"Symptom onset (syncope, angina, dyspnea) in severe AS marks a sharp decline in prognosis."},{"num":24,"stem":"A young woman is found to have a midsystolic click and a late systolic murmur on a routine exam and is asymptomatic. Which valve condition does this represent?","options":[{"letter":"A","text":"Tricuspid regurgitation","correct":false,"expl":"Tricuspid regurgitation is not defined by a mid-systolic click."},{"letter":"B","text":"Mitral valve prolapse","correct":true,"expl":"Correct. A midsystolic click with a late systolic murmur is the signature of mitral valve prolapse."},{"letter":"C","text":"Aortic stenosis","correct":false,"expl":"Aortic stenosis gives a crescendo-decrescendo systolic murmur, not a mid-systolic click."},{"letter":"D","text":"Mitral stenosis","correct":false,"expl":"Mitral stenosis gives an opening snap and diastolic rumble."}],"nb":"MVP can progress to mitral regurgitation if the leaflets fail to coapt or a chorda ruptures."},{"num":25,"stem":"A patient arrives severely dyspneic, sitting bolt upright, with diffuse crackles, an S3 gallop, and pink frothy sputum. What is happening?","options":[{"letter":"A","text":"Isolated right-sided heart failure","correct":false,"expl":"Right-sided failure causes systemic venous congestion (JVD, edema), not pink frothy sputum."},{"letter":"B","text":"Hypovolemic shock","correct":false,"expl":"Hypovolemic shock causes hypoperfusion from volume loss, not pulmonary edema."},{"letter":"C","text":"Constrictive pericarditis","correct":false,"expl":"Constrictive pericarditis causes high venous pressure and a pericardial knock, not acute pulmonary edema with pink froth."},{"letter":"D","text":"Acute pulmonary edema from left-sided heart failure","correct":true,"expl":"Correct. Orthopnea, crackles, S3, and pink frothy sputum are acute pulmonary edema from left-sided failure backing up into the lungs."}],"nb":"The S3 gallop reflects a volume-overloaded ventricle."},{"num":26,"stem":"A patient with long-standing COPD develops jugular venous distension, hepatomegaly, and pitting leg edema, with clear lungs. What is the most likely cardiac diagnosis?","options":[{"letter":"A","text":"Cor pulmonale (right heart failure from chronic lung disease)","correct":true,"expl":"Correct. Chronic lung disease raises pulmonary vascular resistance and overloads the right heart - cor pulmonale - producing systemic venous congestion with clear lungs."},{"letter":"B","text":"Mitral valve prolapse","correct":false,"expl":"MVP does not cause right-sided congestive failure."},{"letter":"C","text":"Aortic stenosis","correct":false,"expl":"Aortic stenosis is a left-sided lesion and does not present this way."},{"letter":"D","text":"Left ventricular systolic failure","correct":false,"expl":"Left ventricular failure would cause pulmonary congestion (crackles), not clear lungs with systemic congestion."}],"nb":"Peripheral edema is the major effect of right ventricular dysfunction."},{"num":27,"stem":"After a large anterior myocardial infarction, a patient is hypotensive with cold, mottled skin, low urine output, and a high pulmonary capillary wedge pressure. Which shock state is this?","options":[{"letter":"A","text":"Distributive (septic) shock","correct":false,"expl":"Septic shock is warm with low SVR and a low wedge pressure early, not cold with high wedge pressure."},{"letter":"B","text":"Hypovolemic shock","correct":false,"expl":"Hypovolemic shock has a LOW wedge pressure from volume loss."},{"letter":"C","text":"Cardiogenic shock","correct":true,"expl":"Correct. Pump failure after a large MI with hypoperfusion despite adequate volume and a high wedge pressure is cardiogenic shock."},{"letter":"D","text":"Neurogenic shock","correct":false,"expl":"Neurogenic shock is warm vasodilation from lost sympathetic tone, not a high-wedge pump failure."}],"nb":"Cardiogenic shock = ↓CO, ↑PCWP, ↑SVR; priorities are revascularization and inotropic support."},{"num":28,"stem":"A trauma patient who has lost a large volume of blood is tachycardic and hypotensive with cold, clammy, vasoconstricted skin and a low filling pressure. Which shock state and priority are correct?","options":[{"letter":"A","text":"Hypovolemic shock","correct":true,"expl":"stop the bleeding and replace volume/blood - Correct. Loss of ≥15–20% of blood volume causes hypovolemic shock (cold, vasoconstricted, low filling pressure); the priority is hemorrhage control and volume/blood replacement."},{"letter":"B","text":"Obstructive shock","correct":false,"expl":"perform pericardiocentesis - Obstructive shock from tamponade would show high venous pressure; pericardiocentesis does not address hemorrhage."},{"letter":"C","text":"Distributive shock","correct":false,"expl":"give vasopressors alone - Distributive shock is a low-SVR vasodilated state, not the cold vasoconstricted picture here."},{"letter":"D","text":"Cardiogenic shock","correct":false,"expl":"give inotropes - Cardiogenic shock is pump failure with high filling pressure, not volume loss."}],"nb":"Hypovolemic shock = ↓CO, ↓PCWP, ↑SVR."}],"28":[{"num":1,"stem":"If the SA node fails, which structure becomes the next pacemaker, and at what intrinsic rate?","options":[{"letter":"A","text":"The atria stop entirely with no escape rhythm","correct":false,"expl":"A backup escape rhythm normally emerges; the heart is not left without a pacemaker."},{"letter":"B","text":"The His-Purkinje system, at 60-100 bpm","correct":false,"expl":"His-Purkinje is the slowest safety net (15-40 bpm), not 60-100."},{"letter":"C","text":"The AV junction, at 40-60 bpm","correct":true,"expl":"Correct. The escape hierarchy is SA (60-100) > AV junction (40-60) > His-Purkinje (15-40); loss of the SA node unmasks the AV junctional escape at 40-60 bpm."},{"letter":"D","text":"The SA node fires faster to compensate","correct":false,"expl":"A failed SA node cannot fire faster; a lower focus takes over."}],"nb":"Each lower focus is slower, so losing a higher pacemaker drops the heart rate."},{"num":2,"stem":"Phase 3 (rapid repolarization) of the cardiac action potential is driven by which ion movement, and it corresponds to which ECG deflection?","options":[{"letter":"A","text":"Potassium efflux; the T wave","correct":true,"expl":"Correct. Phase 3 is dominated by potassium leaving the cell and corresponds to the T wave."},{"letter":"B","text":"Chloride influx; the P wave","correct":false,"expl":"Chloride influx and the P wave are not the phase-3 pairing."},{"letter":"C","text":"Calcium influx; the ST segment","correct":false,"expl":"Calcium influx is phase 2 (ST segment)."},{"letter":"D","text":"Sodium influx; the QRS complex","correct":false,"expl":"Sodium influx is phase 0 (QRS)."}],"nb":"Class III antiarrhythmics block this potassium current, prolonging phase 3 and the QT."},{"num":3,"stem":"During phase 4 (resting membrane potential) of a working myocardial cell, which pump restores the ionic gradients?","options":[{"letter":"A","text":"The ryanodine receptor","correct":false,"expl":"The ryanodine receptor governs intracellular calcium release, not the membrane resting pump."},{"letter":"B","text":"The L-type calcium channel","correct":false,"expl":"L-type calcium channels carry the phase-2 plateau current, not phase-4 restoration."},{"letter":"C","text":"The Na⁺/K⁺-ATPase pump","correct":true,"expl":"Correct. In phase 4 the Na⁺/K⁺-ATPase pumps sodium out in exchange for potassium, restoring the resting gradients."},{"letter":"D","text":"The fast sodium channel","correct":false,"expl":"Fast sodium channels drive phase 0 depolarization, not the resting restoration."}],"nb":"Phase 4 corresponds to the isoelectric baseline on the ECG."},{"num":4,"stem":"During the absolute refractory period, the cardiac cell:","options":[{"letter":"A","text":"Responds normally to any stimulus","correct":false,"expl":"Normal responsiveness returns only later, not during the absolute refractory period."},{"letter":"B","text":"Cannot be re-excited by any stimulus (spans phases 0-2 and early phase 3)","correct":true,"expl":"Correct. In the absolute refractory period no stimulus can generate another action potential; it spans phases 0-2 and part of phase 3."},{"letter":"C","text":"Fires spontaneously without any stimulus","correct":false,"expl":"Spontaneous firing is automaticity, not the refractory state."},{"letter":"D","text":"Responds only to a weaker-than-normal stimulus","correct":false,"expl":"A weaker-than-normal stimulus can excite during the supernormal period, not the absolute refractory period."}],"nb":"The relative refractory and supernormal periods (late phase 3/early 4) underlie after-depolarizations and torsades risk."},{"num":5,"stem":"Which set of values represents normal ECG intervals?","options":[{"letter":"A","text":"PR < 0.04 s and QRS 0.24 s","correct":false,"expl":"These values are non-physiologic and abnormal."},{"letter":"B","text":"PR 0.50 s and QRS 0.02 s","correct":false,"expl":"A 0.50 s PR is markedly prolonged and a 0.02 s QRS is implausibly narrow."},{"letter":"C","text":"PR 0.12-0.20 s and QRS < 0.12 s","correct":true,"expl":"Correct. Normal PR is 0.12-0.20 s and the normal QRS is under 0.12 s."},{"letter":"D","text":"PR 0.30-0.40 s and QRS > 0.20 s","correct":false,"expl":"A PR of 0.30-0.40 s is a first-degree block and a QRS >0.20 s is abnormally wide."}],"nb":"On the grid, one small box = 0.04 s and one large box = 0.20 s; normal QTc < 440 ms (men)/< 460 ms (women)."},{"num":6,"stem":"A patient with symptomatic (unstable) sinus bradycardia should first receive:","options":[{"letter":"A","text":"A calcium channel blocker","correct":false,"expl":"A calcium channel blocker would slow the heart further, worsening bradycardia."},{"letter":"B","text":"Atropine, with pacing if needed","correct":true,"expl":"Correct. Unstable sinus bradycardia is treated with atropine and, if needed, pacing."},{"letter":"C","text":"Adenosine","correct":false,"expl":"Adenosine is used to terminate re-entrant SVT, not to treat bradycardia."},{"letter":"D","text":"Immediate defibrillation","correct":false,"expl":"Defibrillation treats VF/pulseless VT, not a slow sinus rhythm."}],"nb":"Causes include high vagal tone, beta-blockers/digoxin, hypothyroidism, and SA-node ischemia; it is benign in athletes."},{"num":7,"stem":"How is sinus tachycardia distinguished from a paroxysmal supraventricular tachycardia, and how is it managed?","options":[{"letter":"A","text":"Sinus tachycardia has no P waves","correct":false,"expl":"Sinus tachycardia has a normal P wave before every QRS."},{"letter":"B","text":"Sinus tachycardia ramps gradually with the stimulus and is managed by treating the cause; SVT starts and stops abruptly","correct":true,"expl":"Correct. Sinus tachycardia is a graded response to a stimulus (fever, pain, hypovolemia) and is treated by addressing the cause; SVT is abrupt in onset and offset."},{"letter":"C","text":"Both are treated with immediate defibrillation","correct":false,"expl":"Neither is treated with routine defibrillation; SVT responds to vagal maneuvers/adenosine."},{"letter":"D","text":"Sinus tachycardia starts and stops abruptly; SVT ramps gradually","correct":false,"expl":"This reverses the two - SVT is the abrupt one."}],"nb":"Triggers of sinus tachycardia include fever, pain, hypovolemia, anemia, and hyperthyroidism."},{"num":8,"stem":"Which ECG finding characterizes a premature atrial contraction (PAC)?","options":[{"letter":"A","text":"A saw-tooth baseline","correct":false,"expl":"A saw-tooth baseline is atrial flutter."},{"letter":"B","text":"An early, abnormally shaped P wave followed by a normal (narrow) QRS","correct":true,"expl":"Correct. A PAC is an early beat from an atrial ectopic focus: an early abnormal P wave with a normal narrow QRS."},{"letter":"C","text":"A wide, bizarre QRS with no preceding P wave","correct":false,"expl":"A wide, bizarre QRS with no preceding P wave is a PVC, not a PAC."},{"letter":"D","text":"Complete absence of P waves with an irregularly irregular rhythm","correct":false,"expl":"Absent P waves with an irregularly irregular rhythm is atrial fibrillation."}],"nb":"PACs are triggered by stress, caffeine, or electrolyte shifts and are usually benign."},{"num":9,"stem":"What is the first-line acute management of a stable paroxysmal supraventricular tachycardia?","options":[{"letter":"A","text":"Vagal maneuvers, then adenosine","correct":true,"expl":"Correct. Stable PSVT is first treated with vagal maneuvers and then adenosine."},{"letter":"B","text":"Permanent pacemaker placement","correct":false,"expl":"A pacemaker treats bradyarrhythmias/high-grade block, not PSVT."},{"letter":"C","text":"Intravenous magnesium","correct":false,"expl":"IV magnesium treats torsades de pointes."},{"letter":"D","text":"Immediate unsynchronized defibrillation","correct":false,"expl":"Defibrillation is for VF/pulseless VT, not stable PSVT."}],"nb":"Radiofrequency ablation is highly effective for preventing recurrent AV-nodal re-entry and WPW."},{"num":10,"stem":"An ECG shows a constant PR interval with sudden, unpredictable non-conducted P waves (dropped QRS complexes). Which block is this, and what is the risk?","options":[{"letter":"A","text":"Mobitz I (Wenckebach)","correct":false,"expl":"usually benign - Wenckebach shows progressive PR lengthening before a dropped beat, not a fixed PR."},{"letter":"B","text":"First-degree block","correct":false,"expl":"no treatment - First-degree block has a prolonged but constant PR with no dropped beats."},{"letter":"C","text":"Sinus arrhythmia","correct":false,"expl":"a normal variant - Sinus arrhythmia is a benign respiratory rate variation, not a conduction block."},{"letter":"D","text":"Mobitz II second-degree block","correct":true,"expl":"high risk, often needs pacing - Correct. A fixed PR with sudden dropped beats is Mobitz II, a His\u0002Purkinje failure that is high-risk and often needs pacing."}],"nb":"Mobitz II can progress to complete block/asystole, hence the urgency to pace."},{"num":11,"stem":"A bundle branch block produces which QRS change, and what is the classic right-bundle pattern?","options":[{"letter":"A","text":"A shortened PR; a saw-tooth baseline","correct":false,"expl":"A saw-tooth baseline is atrial flutter."},{"letter":"B","text":"No QRS change; peaked T waves","correct":false,"expl":"BBB does widen the QRS; peaked T waves suggest hyperkalemia."},{"letter":"C","text":"A widened QRS; an rsR′ 'rabbit-ear' pattern in V1-V2","correct":true,"expl":"Correct. When one bundle fails, the ventricles activate sequentially, widening the QRS; RBBB gives an rsR′ 'rabbit-ear' pattern in V1-V2."},{"letter":"D","text":"A narrowed QRS; a delta wave","correct":false,"expl":"A delta wave with a short PR is pre-excitation (WPW), not bundle branch block."}],"nb":"A NEW left bundle branch block with ischemic symptoms is a concerning finding."},{"num":12,"stem":"Which ECG features identify a premature ventricular contraction (PVC)?","options":[{"letter":"A","text":"A saw-tooth flutter baseline","correct":false,"expl":"A saw-tooth baseline is atrial flutter."},{"letter":"B","text":"A short PR interval with a delta wave","correct":false,"expl":"A short PR with delta wave is pre-excitation (WPW)."},{"letter":"C","text":"A normal narrow QRS preceded by an early abnormal P wave","correct":false,"expl":"An early abnormal P before a normal QRS is a PAC, not a PVC."},{"letter":"D","text":"A wide, bizarre QRS with no preceding P wave, often with a compensatory pause","correct":true,"expl":"Correct. A PVC arises from a ventricular focus and spreads cell-to-cell, giving a wide, bizarre QRS with no preceding P wave and often a compensatory pause."}],"nb":"PVCs warrant evaluation when frequent (>6/min), multifocal, or bigeminal."},{"num":13,"stem":"Re-entry, a dominant mechanism of paroxysmal tachycardias, is best described as:","options":[{"letter":"A","text":"A single ectopic focus firing faster than the SA node","correct":false,"expl":"An ectopic focus firing fast is enhanced automaticity, a different mechanism."},{"letter":"B","text":"Failure of an impulse to conduct through the AV node","correct":false,"expl":"Failure of AV conduction is a block, not re-entry."},{"letter":"C","text":"A continuously circulating impulse that repeatedly re-excites a region of the heart","correct":true,"expl":"Correct. Re-entry is a self-perpetuating circulating impulse that repeatedly re-excites myocardium, driving many paroxysmal tachycardias."},{"letter":"D","text":"Complete absence of electrical activity","correct":false,"expl":"Absent electrical activity is asystole, not re-entry."}],"nb":"Interrupting the circuit (vagal maneuvers, adenosine, ablation) can terminate or cure re-entrant tachycardias."},{"num":14,"stem":"Which Vaughan-Williams class acts by blocking potassium channels to prolong the action potential and refractory period (and can prolong the QT)?","options":[{"letter":"A","text":"Class I (e.g., lidocaine)","correct":false,"expl":"Class I agents block fast sodium channels."},{"letter":"B","text":"Class IV (e.g., verapamil)","correct":false,"expl":"Class IV agents block slow calcium channels and slow AV nodal conduction."},{"letter":"C","text":"Class II (beta-blockers)","correct":false,"expl":"Class II agents are beta-blockers that blunt sympathetic drive."},{"letter":"D","text":"Class III (e.g., amiodarone, sotalol)","correct":true,"expl":"Correct. Class III agents inhibit the potassium repolarizing current, prolonging the action potential/refractoriness and the QT."}],"nb":"Because Class III agents prolong the QT, they carry a torsades risk."},{"num":15,"stem":"A young adult reports palpitations that begin and end abruptly; the ECG shows a narrow, very regular tachycardia at 190 bpm. After vagal maneuvers fail, what is the next step?","options":[{"letter":"A","text":"Immediate defibrillation","correct":false,"expl":"Defibrillation is reserved for VF/pulseless VT, not stable PSVT."},{"letter":"B","text":"Intravenous adenosine","correct":true,"expl":"Correct. Abrupt-onset narrow regular tachycardia is paroxysmal SVT; when vagal maneuvers fail, IV adenosine is next."},{"letter":"C","text":"Intravenous magnesium","correct":false,"expl":"IV magnesium treats torsades de pointes."},{"letter":"D","text":"Permanent pacemaker","correct":false,"expl":"A pacemaker is for bradyarrhythmias, not PSVT."}],"nb":"Radiofrequency ablation is highly effective for preventing recurrences."},{"num":16,"stem":"An elderly patient has recurrent syncope; the ECG shows P waves and QRS complexes marching independently at a ventricular rate of about 35 bpm. What is the definitive treatment?","options":[{"letter":"A","text":"Observation only","correct":false,"expl":"Observation is unsafe given syncope and complete block."},{"letter":"B","text":"Permanent pacemaker","correct":true,"expl":"Correct. AV dissociation with a slow ventricular escape is complete (third-degree) heart block, which causes Stokes-Adams syncope and needs a permanent pacemaker."},{"letter":"C","text":"Adenosine","correct":false,"expl":"Adenosine slows AV conduction and would worsen the situation."},{"letter":"D","text":"Beta-blocker","correct":false,"expl":"A beta-blocker would further depress the rate."}],"nb":"In complete block the atrial and ventricular pacemakers fire independently."},{"num":17,"stem":"A patient with a prior myocardial infarction develops a regular wide-complex tachycardia at 180 bpm with AV dissociation and becomes hypotensive and confused. What is the immediate treatment?","options":[{"letter":"A","text":"Synchronized cardioversion","correct":true,"expl":"Correct. A regular wide-complex tachycardia after MI with AV dissociation is ventricular tachycardia; an unstable patient with a pulse gets synchronized cardioversion (defibrillate if pulseless)."},{"letter":"B","text":"Oral aspirin","correct":false,"expl":"Aspirin has no role in acutely terminating VT."},{"letter":"C","text":"Vagal maneuvers","correct":false,"expl":"Vagal maneuvers address re-entrant SVT, not unstable VT."},{"letter":"D","text":"Reassurance and observation","correct":false,"expl":"Observation is unsafe in unstable VT, which can degenerate to VF."}],"nb":"AV dissociation favors VT over SVT with aberrancy; treat the patient, not just the tracing."},{"num":18,"stem":"A patient taking a high dose of a beta-blocker feels dizzy; the ECG shows a normal-appearing sinus rhythm at 42 bpm. What is the appropriate initial approach?","options":[{"letter":"A","text":"Cardiovert immediately","correct":false,"expl":"Cardioversion is for tachyarrhythmias, not bradycardia."},{"letter":"B","text":"Start adenosine","correct":false,"expl":"Adenosine slows the AV node and would worsen the slow rate."},{"letter":"C","text":"Give another dose of the beta-blocker","correct":false,"expl":"More beta-blockers would deepen the bradycardia."},{"letter":"D","text":"Recognize drug-induced sinus bradycardia","correct":true,"expl":"hold/adjust the beta-blocker and give atropine if unstable - Correct. This is drug\u0002induced sinus bradycardia; the step is to hold or reduce the offending beta-blocker and give atropine (or pace) only if the patient is unstable."}],"nb":"Sinus bradycardia is a normal sinus sequence at a rate below 60 bpm."}],"30":[{"num":1,"stem":"Most of the symptoms of a common cold (congestion, sore throat, mild fever) are best explained by:","options":[{"letter":"A","text":"A bacterial superinfection in every","correct":false,"expl":"Bacterial superinfection is a complication, not the cause of ordinary cold symptoms."},{"letter":"B","text":"Loss of surfactant","correct":false,"expl":"Surfactant is an alveolar substance unrelated to the common cold."},{"letter":"C","text":"The host's own immune/inflammatory response","correct":true,"expl":"Correct. Cold symptoms are largely the host inflammatory response, not direct viral tissue destruction."},{"letter":"D","text":"Direct viral destruction of lung parenchyma","correct":false,"expl":"The common cold is an upper-tract infection; it does not destroy lung parenchyma."}],"nb":"This is why treatment is supportive and antibiotics do not help."},{"num":2,"stem":"Because the sinuses lie millimeters from the orbit and cranial vault, untreated bacterial rhinosinusitis can extend to cause:","options":[{"letter":"A","text":"Deep vein thrombosis","correct":false,"expl":"DVT is a venous thrombosis, not a sinus complication."},{"letter":"B","text":"Pancreatitis","correct":false,"expl":"Pancreatitis is unrelated to sinus infection."},{"letter":"C","text":"Orbital cellulitis, meningitis, or brain abscess","correct":true,"expl":"Correct. Anterior spread causes orbital cellulitis; posterior/superior spread causes meningitis or brain abscess."},{"letter":"D","text":"Appendicitis","correct":false,"expl":"Appendicitis is an abdominal process, unrelated to sinus spread."}],"nb":"Orbital cellulitis (red, swollen, proptotic eye) threatens vision and is an emergency."},{"num":3,"stem":"Which organisms most commonly cause acute bacterial rhinosinusitis?","options":[{"letter":"A","text":"Coxsackievirus and echovirus","correct":false,"expl":"Coxsackie/echovirus are enteroviruses, not bacterial sinusitis causes."},{"letter":"B","text":"Escherichia coli and Salmonella","correct":false,"expl":"E. coli and Salmonella are enteric organisms, not sinus pathogens."},{"letter":"C","text":"Streptococcus pneumoniae, Haemophilus influenzae, and Moraxella catarrhalis","correct":true,"expl":"Correct. Acute bacterial sinusitis is caused by the resident respiratory flora: S. pneumoniae, H. influenzae, and M. catarrhalis."},{"letter":"D","text":"Mycobacterium tuberculosis and fungi","correct":false,"expl":"TB and fungi are not the typical acute sinusitis organisms."}],"nb":"Chronic sinusitis (>12 weeks) shifts toward anaerobes, Staphylococcus, and Pseudomonas."},{"num":4,"stem":"Why must the influenza vaccine be reformulated and given every year?","options":[{"letter":"A","text":"The virus is a bacterium that develops antibiotic resistance","correct":false,"expl":"Influenza is a virus, not a bacterium; antibiotic resistance is irrelevant."},{"letter":"B","text":"Antigenic drift","correct":true,"expl":"small continuous mutations in the surface proteins - makes last year's immunity a poor fit - Correct. Antigenic drift steadily changes the surface proteins, so the target must be re-aimed each season."},{"letter":"C","text":"Influenza has no surface antigens","correct":false,"expl":"Influenza has surface hemagglutinin and neuraminidase antigens that drift."},{"letter":"D","text":"The vaccine wears off within one week","correct":false,"expl":"Waning within a week is not the reason; the antigens themselves change."}],"nb":"Antigenic shift (sudden reassortment) is the separate process that produces pandemics."},{"num":5,"stem":"Which correctly contrasts the two influenza vaccine types?","options":[{"letter":"A","text":"Both are live and given by injection","correct":false,"expl":"Only the LAIV is live, and it is intranasal."},{"letter":"B","text":"Trivalent inactivated vaccine is given by injection; the live attenuated vaccine is given intranasally","correct":true,"expl":"Correct. The inactivated (TIIV) vaccine is injected; the live attenuated (LAIV) vaccine is intranasal."},{"letter":"C","text":"Neither is modified from year to year","correct":false,"expl":"Both are updated annually in response to antigenic change."},{"letter":"D","text":"The inactivated vaccine is intranasal; the live vaccine is injected","correct":false,"expl":"This reverses the routes."}],"nb":"Vaccination protects high-risk groups and, through herd immunity, those who cannot mount a response."},{"num":6,"stem":"Which influenza type is the most common and most severe, can infect multiple species, and is the pandemic strain?","options":[{"letter":"A","text":"Type B","correct":false,"expl":"Type B is clinically important but not subtyped and is not the multi-species pandemic strain."},{"letter":"B","text":"Type D","correct":false,"expl":"Type D is not among the clinically important human types described."},{"letter":"C","text":"Type A","correct":true,"expl":"Correct. Type A is most common and severe, infects multiple species, and is the pandemic strain."},{"letter":"D","text":"Type C","correct":false,"expl":"Type C causes mild disease."}],"nb":"Type A is subtyped by its hemagglutinin (H) and neuraminidase (N) antigens."},{"num":7,"stem":"In lobar pneumococcal pneumonia, which stage follows red hepatization, as the red cells break down and a gray fibrinopurulent exudate remains?","options":[{"letter":"A","text":"Resolution","correct":false,"expl":"Resolution is the final stage when debris is cleared."},{"letter":"B","text":"Cavitation","correct":false,"expl":"Cavitation is characteristic of reactivation TB, not the lobar pneumonia stages."},{"letter":"C","text":"Congestion","correct":false,"expl":"Congestion is the first, boggy stage that precedes red hepatization."},{"letter":"D","text":"Gray hepatization","correct":true,"expl":"Correct. Gray hepatization follows red hepatization: RBCs disintegrate and a gray, still-solid fibrinopurulent exudate persists."}],"nb":"Sequence: congestion → red hepatization → gray hepatization → resolution."},{"num":8,"stem":"In the resolution stage of lobar pneumonia, what happens to the lung?","options":[{"letter":"A","text":"Enzymes and macrophages clear the debris and the lung architecture is restored","correct":true,"expl":"Correct. In resolution, enzymes digest the debris and macrophages clear it, restoring normal lung architecture and function."},{"letter":"B","text":"The alveoli fill with blood","correct":false,"expl":"Alveolar filling with blood describes earlier hepatization, not resolution."},{"letter":"C","text":"The pleura calcifies","correct":false,"expl":"Pleural calcification is not a stage of lobar pneumonia."},{"letter":"D","text":"The lobe permanently turns to scar with no recovery","correct":false,"expl":"Uncomplicated lobar pneumonia typically resolves rather than permanently scarring."}],"nb":"'Hepatization' means the lung had become as dense as liver before clearing."},{"num":9,"stem":"Streptococcus pneumoniae, the reference organism for bacterial pneumonia, is best described as:","options":[{"letter":"A","text":"A gram-positive encapsulated diplococcus that colonizes the nasopharynx before invading the alveoli","correct":true,"expl":"Correct. The pneumococcus is a gram-positive encapsulated diplococcus that colonizes the nasopharynx, then invades the alveoli."},{"letter":"B","text":"An acid-fast bacillus with a waxy wall","correct":false,"expl":"An acid-fast waxy-walled bacillus is Mycobacterium tuberculosis."},{"letter":"C","text":"A misfolded protein with no nucleic acid","correct":false,"expl":"A nucleic-acid-free misfolded protein is a prion."},{"letter":"D","text":"A gram-negative rod with an endotoxin","correct":false,"expl":"A gram-negative rod with endotoxin describes organisms like enteric bacteria, not the pneumococcus."}],"nb":"Its polysaccharide capsule resists phagocytosis and is the vaccine target."},{"num":10,"stem":"Which organisms are characteristic of hospital-acquired (nosocomial) pneumonia?","options":[{"letter":"A","text":"Rhinovirus and RSV","correct":false,"expl":"Rhinovirus/RSV are community upper-respiratory viruses."},{"letter":"B","text":"Streptococcus viridans","correct":false,"expl":"Strep. viridans is an oral organism linked to endocarditis, not nosocomial pneumonia."},{"letter":"C","text":"Mycoplasma pneumoniae only","correct":false,"expl":"Mycoplasma causes community-acquired atypical pneumonia."},{"letter":"D","text":"Pseudomonas aeruginosa, Klebsiella, and Staphylococcus (including MRSA)","correct":true,"expl":"Correct. Hospital-acquired pneumonia is dominated by resistant organisms such as Pseudomonas, Klebsiella, and Staphylococcus (MRSA)."}],"nb":"Heavy hospital antibiotic exposure selects for these resistant survivors."},{"num":11,"stem":"Patchy consolidation scattered through more than one lobe, typical of the elderly and hospital-acquired, polymicrobial disease, describes:","options":[{"letter":"A","text":"Bronchopneumonia","correct":true,"expl":"Correct. Bronchopneumonia is patchy, multi-lobe consolidation centered on the airways, typical of the elderly and hospital-acquired infection."},{"letter":"B","text":"Miliary tuberculosis","correct":false,"expl":"Miliary TB is countless tiny disseminated nodules, not patchy airway-centered consolidation."},{"letter":"C","text":"A solitary pulmonary nodule","correct":false,"expl":"A solitary nodule is a single lesion, not multifocal pneumonia."},{"letter":"D","text":"Lobar pneumonia","correct":false,"expl":"Lobar pneumonia is uniform consolidation of a single lobe."}],"nb":"Bronchopneumonia implies spread down the airways into a weakened lung."},{"num":12,"stem":"The pneumococcal (23-valent) vaccine works by targeting which structure of Streptococcus pneumoniae?","options":[{"letter":"A","text":"Its DNA polymerase","correct":false,"expl":"The vaccine is directed at the capsule, not an intracellular enzyme."},{"letter":"B","text":"Its acid-fast wall","correct":false,"expl":"An acid-fast wall belongs to mycobacteria, not the pneumococcus."},{"letter":"C","text":"Its flagella","correct":false,"expl":"The pneumococcus is not defined by flagella."},{"letter":"D","text":"Its polysaccharide capsule","correct":true,"expl":"Correct. The vaccine targets the polysaccharide capsule, the organism's anti-phagocytic armor."}],"nb":"It is pushed in the elderly and chronically ill, whose lungs cannot afford consolidation."},{"num":13,"stem":"Tuberculosis is transmitted primarily by:","options":[{"letter":"A","text":"Airborne droplet nuclei from a person with active pulmonary TB","correct":true,"expl":"Correct. TB spreads via airborne droplet nuclei from someone with active pulmonary disease."},{"letter":"B","text":"Contaminated food and water","correct":false,"expl":"Food/water transmission is not the route for pulmonary TB."},{"letter":"C","text":"Direct skin contact with a Ghon focus","correct":false,"expl":"A Ghon focus is a healed internal lesion, not a source of skin-contact spread."},{"letter":"D","text":"Mosquito bites","correct":false,"expl":"TB is not vector-borne."}],"nb":"Latent TB is asymptomatic and non-contagious."},{"num":14,"stem":"The center of a tuberculous granuloma characteristically undergoes which kind of necrosis?","options":[{"letter":"A","text":"Fibrinoid necrosis of a vessel","correct":false,"expl":"Fibrinoid necrosis affects vessel walls in certain vasculitides, not the TB granuloma."},{"letter":"B","text":"Coagulative necrosis of an infarct","correct":false,"expl":"Coagulative necrosis is the pattern of ischemic infarction, not the TB granuloma center."},{"letter":"C","text":"Fat necrosis","correct":false,"expl":"Fat necrosis occurs in adipose tissue (e.g., pancreatitis), not the TB granuloma."},{"letter":"D","text":"Caseous (cheese-like) necrosis","correct":true,"expl":"Correct. The granuloma center undergoes caseous, cheese-like necrosis from killed and starved tissue."}],"nb":"When the immune system cannot kill the organism, it walls it off in a granuloma."},{"num":15,"stem":"In an immunocompetent adult, primary tuberculosis usually:","options":[{"letter":"A","text":"Always disseminates as miliary TB","correct":false,"expl":"Miliary dissemination occurs when containment fails (very young, very old, immunocompromised), not usually in a healthy adult."},{"letter":"B","text":"Is silent and walled off, leaving a latent, asymptomatic, non-contagious infection","correct":true,"expl":"Correct. In a healthy adult, primary TB is usually silent; the host walls it off and carries a latent infection unknowingly."},{"letter":"C","text":"Immediately produces cavitary disease and hemoptysis","correct":false,"expl":"Immediate cavitation is characteristic of reactivation, and progression at first exposure occurs mainly when immunity is weak."},{"letter":"D","text":"Cannot be detected by any test","correct":false,"expl":"Exposure is detectable by PPD/IGRA even when latent."}],"nb":"Primary infection progresses directly to active disease when immunity is weak - young children and HIV patients."},{"num":16,"stem":"When confirming ACTIVE tuberculosis, which test is the gold standard despite being slow, and which detects DNA within hours?","options":[{"letter":"A","text":"Culture is the gold standard; nucleic acid amplification (NAAT) is rapid","correct":true,"expl":"Correct. Culture is the gold standard but slow because the organism grows sluggishly; NAAT detects TB DNA within hours."},{"letter":"B","text":"Blood cultures are the gold standard for pulmonary TB","correct":false,"expl":"Pulmonary TB is confirmed on sputum, not routine blood cultures."},{"letter":"C","text":"The PPD is the gold standard; culture is rapid","correct":false,"expl":"The PPD only proves exposure and cannot confirm active disease; it is not a gold standard for activity."},{"letter":"D","text":"Chest X-ray is definitive; no other test is needed","correct":false,"expl":"A chest X-ray suggests but cannot confirm active TB; microbiology is required."}],"nb":"An acid-fast sputum smear highlights the waxy-walled bacilli quickly but is less sensitive than culture."},{"num":17,"stem":"Why is directly observed therapy (DOT) used for tuberculosis treatment?","options":[{"letter":"A","text":"The drugs must be given intravenously by a nurse","correct":false,"expl":"RIPE is oral; DOT is about adherence, not IV administration."},{"letter":"B","text":"Patients feel well long before cure and stop early, which breeds multidrug-resistant TB","correct":true,"expl":"Correct. Patients improve well before they are cured and tend to quit; DOT ensures completion, because stopping early is how MDR-TB is bred."},{"letter":"C","text":"DOT shortens therapy to one week","correct":false,"expl":"DOT does not shorten therapy; TB still requires 6–9 months."},{"letter":"D","text":"A single missed dose is immediately fatal","correct":false,"expl":"A single missed dose is not immediately fatal; the concern is cumulative non-adherence and resistance."}],"nb":"The whole treatment philosophy aims to never let the organism evolve around the drugs."},{"num":18,"stem":"Which lung cancer is a peripheral, highly anaplastic (poorly differentiated) tumor with a poor prognosis?","options":[{"letter":"A","text":"Small cell carcinoma","correct":false,"expl":"Small cell carcinoma is central and neuroendocrine, not the large-cell description."},{"letter":"B","text":"Squamous cell carcinoma","correct":false,"expl":"Squamous cell carcinoma is central and smoking-linked, arising from transformed bronchial lining."},{"letter":"C","text":"Large cell carcinoma","correct":true,"expl":"Correct. Large cell carcinoma is peripheral, highly anaplastic/undifferentiated, and carries a poor prognosis."},{"letter":"D","text":"Adenocarcinoma in situ","correct":false,"expl":"Adenocarcinoma in situ is an early glandular lesion, not the anaplastic large-cell type."}],"nb":"Large cell is a non-small-cell type and affects larger airways."},{"num":19,"stem":"A lung tumor causes new hoarseness. Which local structure has it most likely invaded?","options":[{"letter":"A","text":"The phrenic nerve","correct":false,"expl":"Phrenic nerve invasion causes diaphragmatic paralysis, not hoarseness."},{"letter":"B","text":"The thoracic duct","correct":false,"expl":"Thoracic duct involvement causes a chylothorax, not hoarseness."},{"letter":"C","text":"The pulmonary vein","correct":false,"expl":"Pulmonary vein involvement does not cause hoarseness."},{"letter":"D","text":"The recurrent laryngeal nerve","correct":true,"expl":"Correct. Invasion of the recurrent laryngeal nerve paralyzes a vocal cord, producing hoarseness."}],"nb":"Local invasion can also cause chest pain (pleura) and dysphagia (esophageal compression)."},{"num":20,"stem":"After imaging suggests lung cancer, why is a tissue biopsy essential?","options":[{"letter":"A","text":"Biopsy determines the patient's smoking history","correct":false,"expl":"Biopsy identifies tumor type, not smoking history."},{"letter":"B","text":"Biopsy is only for staging, not diagnosis","correct":false,"expl":"Biopsy establishes the diagnosis and cell type, not only staging."},{"letter":"C","text":"Imaging alone can determine the exact cell type","correct":false,"expl":"Imaging cannot definitively establish the histologic cell type."},{"letter":"D","text":"Only tissue can prove cancer and answer the pivotal question of small cell versus non-small cell, which determines treatment","correct":true,"expl":"Correct. Imaging can suggest but not prove cancer; biopsy provides tissue to answer small-cell vs non-small\u0002cell, which drives whether surgery or chemotherapy is used."}],"nb":"Small cell → chemotherapy (rarely surgery); localized non-small cell → surgery ± adjuvant therapy."},{"num":21,"stem":"Ten days into a 'cold', a patient develops worsening facial pain and then a red, swollen, painful, bulging eye. What complication of bacterial rhinosinusitis is this, and what is its significance?","options":[{"letter":"A","text":"A simple stye needing no treatment","correct":false,"expl":"A stye is a minor eyelid lesion, not this proptotic, painful process from sinusitis."},{"letter":"B","text":"Allergic conjunctivitis","correct":false,"expl":"Allergic conjunctivitis is itchy and bilateral, not a painful proptotic emergency."},{"letter":"C","text":"Orbital cellulitis","correct":true,"expl":"a vision-threatening emergency from anterior spread - Correct. Anterior spread of sinus infection to the orbit produces orbital cellulitis, a true emergency with vision at risk."},{"letter":"D","text":"Migraine with aura","correct":false,"expl":"Migraine does not cause a red, swollen, proptotic eye."}],"nb":"Posterior/superior spread instead threatens meningitis or brain abscess."},{"num":22,"stem":"During flu season a patient has an abrupt onset of high fever, shaking chills, diffuse myalgias, headache, and profound fatigue. How does this differ from a common cold, and what is the diagnosis?","options":[{"letter":"A","text":"Bacterial pneumonia","correct":false,"expl":"myalgias are diagnostic of pneumonia - Myalgias here reflect systemic inflammation from influenza, not a specific sign of pneumonia."},{"letter":"B","text":"Influenza","correct":true,"expl":"abrupt, systemic, and severe, versus the cold's gradual, mild, nasal illness - Correct. Influenza is abrupt in onset and systemic/severe (high fever, myalgias, prostration), unlike the cold's gradual, mild, nose-centered course."},{"letter":"C","text":"Allergic rhinitis","correct":false,"expl":"fever and myalgias are classic for allergy - Allergic rhinitis does not cause fever and myalgias."},{"letter":"D","text":"Common cold","correct":false,"expl":"the systemic features are typical of a cold - A cold is mild and localized to the nose, not this systemic prostrating illness."}],"nb":"The myalgias are systemic inflammation, not virus in the muscle."},{"num":23,"stem":"On hospital day 5, a mechanically ventilated ICU patient develops a new fever and a new infiltrate; cultures grow Pseudomonas aeruginosa. How is this pneumonia classified?","options":[{"letter":"A","text":"Atypical (Mycoplasma) pneumonia","correct":false,"expl":"Mycoplasma is a community atypical organism, not a day-5 ICU Pseudomonas."},{"letter":"B","text":"Hospital-acquired (ventilator-associated) pneumonia","correct":true,"expl":"Correct. Onset >48 hours after admission with a resistant organism like Pseudomonas is hospital-acquired (here, ventilator-associated) pneumonia."},{"letter":"C","text":"Aspiration pneumonitis from gastric acid","correct":false,"expl":"The picture is bacterial infection, not sterile acid aspiration."},{"letter":"D","text":"Community-acquired pneumonia","correct":false,"expl":"Community-acquired pneumonia begins outside the hospital or within 48 hours of admission."}],"nb":"Nosocomial pneumonia is ~90% bacterial and carries 20–50% mortality."},{"num":24,"stem":"A man from a high-prevalence country has months of cough, drenching night sweats, and weight loss; a chest film shows an upper-lobe cavity and he now has hemoptysis. What is the most likely diagnosis?","options":[{"letter":"A","text":"Reactivation tuberculosis","correct":true,"expl":"Correct. Chronic cough, night sweats, and weight loss with upper-lobe cavitation and hemoptysis is reactivation TB."},{"letter":"B","text":"Acute bronchitis","correct":false,"expl":"Acute bronchitis does not cavitate or cause months of night sweats and weight loss."},{"letter":"C","text":"A common cold","correct":false,"expl":"A common cold is a brief, mild upper-respiratory illness."},{"letter":"D","text":"Acute pneumococcal pneumonia","correct":false,"expl":"Pneumococcal pneumonia is acute (days) with rusty sputum, not a months-long cavitary wasting illness."}],"nb":"Reactivation favors the upper lobes (highest oxygen for this aerobe) and cavitates, breaching vessels to cause hemoptysis."},{"num":25,"stem":"A long-time smoker has had pneumonia in the same right-lower-lobe location three times and now coughs up blood. Bronchoscopy shows an obstructing mass. What single result most determines his treatment path?","options":[{"letter":"A","text":"His body-mass index","correct":false,"expl":"BMI is not the determinant of cancer treatment type."},{"letter":"B","text":"Whether the biopsy shows small cell versus non-small cell carcinoma","correct":true,"expl":"Correct. Recurrent same-site pneumonia plus hemoptysis points to an obstructing tumor; the biopsy's small-cell vs non-small-cell result determines whether treatment is chemotherapy or surgery."},{"letter":"C","text":"His serum sodium level","correct":false,"expl":"Serum sodium may hint at SIADH but does not by itself decide the treatment path."},{"letter":"D","text":"The color of his sputum","correct":false,"expl":"Sputum color does not determine tumor management."}],"nb":"Same-site recurrent pneumonia should prompt the question, 'What is blocking that airway?'"},{"num":26,"stem":"An asymptomatic patient has a routine chest film showing a small calcified parenchymal nodule with a calcified hilar lymph node. What does this represent?","options":[{"letter":"A","text":"Active miliary tuberculosis","correct":false,"expl":"Miliary TB is a 'snowstorm' of tiny nodules in an ill patient, not a single calcified complex in an asymptomatic one."},{"letter":"B","text":"Metastatic lung cancer","correct":false,"expl":"Metastatic cancer produces growing masses, not a calcified Ghon complex."},{"letter":"C","text":"An acute bacterial pneumonia","correct":false,"expl":"Acute pneumonia produces consolidation, not a calcified nodule-plus-node."},{"letter":"D","text":"A Ghon complex","correct":true,"expl":"healed primary TB (latent infection) - Correct. A calcified parenchymal focus plus its draining hilar node is a Ghon complex, the healed footprint of primary TB, i.e., latent infection."}],"nb":"That calcified nodule can quietly harbor living, dormant bacilli."}],"31":[{"num":1,"stem":"How do central and peripheral cyanosis differ?","options":[{"letter":"A","text":"Central cyanosis reflects arterial deoxyhemoglobin (lips, tongue); peripheral reflects slow flow with increased O₂ extraction (fingers, nose, ears)","correct":true,"expl":"Correct. Central cyanosis comes from increased arterial deoxyhemoglobin and is seen in the lips and tongue; peripheral cyanosis comes from sluggish flow with greater O₂ extraction in the extremities, nose, and ears."},{"letter":"B","text":"Neither involves deoxygenated hemoglobin","correct":false,"expl":"Cyanosis is defined by deoxygenated hemoglobin (~5 g/dL to be visible)."},{"letter":"C","text":"Central cyanosis affects only the fingers; peripheral affects the tongue","correct":false,"expl":"This reverses the two distributions."},{"letter":"D","text":"Both are caused by carbon monoxide poisoning","correct":false,"expl":"Cyanosis here reflects deoxyhemoglobin, not carbon monoxide."}],"nb":"Cyanosis becomes visible at roughly 5 g/dL of deoxygenated hemoglobin."},{"num":2,"stem":"A purulent pleural effusion containing leukocytes, protein, and glucose, arising from adjacent bacterial pneumonia o
