 then invades the alveoli; the lobe passes through congestion/edema → red hepatization → gray hepatization → resolution.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Sudden chills, high fever, pleuritic chest pain, and RUST-COLORED (blood-tinged) sputum; lobar consolidation on chest X-ray.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Antibiotics; prevented by the pneumococcal vaccine (23-valent polysaccharide/PCV).</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Tuberculosis</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Chronic infection by Mycobacterium tuberculosis, mainly of the lungs.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Inhaled bacilli are engulfed by macrophages, triggering a CELL-MEDIATED (type IV) response over 3–6 weeks that walls the organism into a granuloma (Ghon focus; Ghon complex with the node). This confers resistance but also tissue hypersensitivity (the basis of the skin test).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Primary TB is often silent; reactivation gives chronic cough ± hemoptysis, low-grade fever, NIGHT SWEATS, and weight loss. Miliary TB spreads widely (kidney is the most common extrapulmonary site).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Diagnosed by skin test (delayed hypersensitivity), acid-fast culture, or interferon-gamma release assay (QuantiFERON); treated with MULTIPLE drugs — RIPE (rifampin, isoniazid, pyrazinamide, ethambutol) — because of resistance.</p></div>\n            </div>\n</div>\n<div class=\"ds-section-label\">Lung Neoplasms</div>\n<div class=\"ds-grid\">\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Lung Cancer</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>The leading cause of cancer death in both men and women.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>95% of primary tumors arise from the BRONCHIAL epithelium, driven by smoking and environmental exposures; most lung masses overall are actually metastases (breast, colon, renal).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Chronic cough, dyspnea, wheezing; hemoptysis when a lesion erodes a vessel; weight loss; often found on routine chest X-ray.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Diagnosis by imaging, bronchoscopy, and cytology; treatment by surgery, radiation, chemotherapy.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Small Cell Lung Cancer (SCLC)</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>An aggressive, central, neuroendocrine lung cancer.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>The STRONGEST association with cigarette smoking; poorly differentiated small cells that grow and metastasize rapidly (brain metastases common).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Central location; PARANEOPLASTIC syndromes (SIADH, ectopic ACTH/Cushing); very short survival if untreated.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Chemotherapy (usually too disseminated for surgery).</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Non-Small Cell Lung Cancer (NSCLC)</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>The three non-small-cell types.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Squamous cell — central, in male smokers, slow-spreading, secretes PTHrP (hypercalcemia). Adenocarcinoma — MOST COMMON overall, peripheral, arising in scars, least tied to smoking. Large cell — highly anaplastic, poor prognosis.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Squamous → hypercalcemia; adenocarcinoma → peripheral nodule; a peripheral Pancoast tumor can compress the sympathetic chain (Horner syndrome).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Surgery when localized, plus radiation/chemo; molecular testing guides targeted therapy.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Complications of Lung Cancer</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Local invasion and remote effects.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>The tumor invades adjacent structures or secretes bioactive products.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Superior vena cava syndrome; recurrent laryngeal nerve (hoarseness) or phrenic nerve palsy; Pancoast tumor → Horner syndrome; paraneoplastic endocrine/neurologic syndromes.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Recognizing these syndromes can be the first clue to an occult lung cancer.</p></div>\n            </div>\n</div>", "31": "<div class=\"ds-missing card\" style=\"background:var(--taupe3);\">\n          <h3>Disease summary not available yet for this chapter</h3>\n          <p style=\"font-size:12.5px;line-height:1.6;\">The file uploaded for Ch 31 (<em>Chapter_31 — Disorders of Ventilation &amp; Gas Exchange.pdf</em>) turned out to be a duplicate of the Questions &amp; Cases document, not the actual Disease Summary Sheet — so there's nothing to reorganize yet. Upload the real Ch 31 disease summary sheet and I'll build this card set to match the others.</p>\n        </div>", "33": "<h3 class=\"ds-chlabel\">Ch 33 — Disease Summary: Disorders of Renal Function</h3>\n<div class=\"ds-section-label\">Congenital &amp; Cystic</div>\n<div class=\"ds-grid\">\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Renal Agenesis</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Failure of one or both kidneys to form when a ureteric bud fails.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Unilateral — one kidney never develops and the other hypertrophies to do the work of two. Bilateral — no fetal kidneys means no fetal urine, and after ~16 weeks fetal urine IS the amniotic fluid.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Unilateral is usually silent and found incidentally; bilateral triggers the Potter sequence and is incompatible with life.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Protect a solitary kidney — counsel against contact sports, avoid nephrotoxins, and monitor BP and protein, because a single hyperfiltering kidney eventually scars.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Potter Sequence</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>A cascade (not a syndrome): any cause of absent fetal urine leads to oligohydramnios, fetal compression, and pulmonary hypoplasia.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Amniotic fluid cushions the fetus and provides the stretch signal that grows the lungs. Remove it and the uterus compresses the fetus while the lungs never develop.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Potter facies (flattened nose, recessed chin, low-set ears), club feet, and lethal respiratory failure at birth — the baby dies of lungs, not kidneys.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Any initiating event counts: bilateral agenesis, ARPKD, cystic dysplasia, or posterior urethral valves. Outcome is driven entirely by lung development.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Renal Dysgenesis &amp; Malposition (hypoplasia, ectopic, horseshoe)</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Kidneys that are too small (hypoplasia), in the wrong place (ectopic/pelvic), or fused across the midline (horseshoe).</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Errors in the migration and fusion steps of development; a horseshoe kidney is trapped under the inferior mesenteric artery as it tries to ascend.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Usually incidental, but the abnormal drainage causes stasis.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Monitor and treat downstream complications. Reinforces the loop: built wrong → drains poorly → drains poorly gets stones and infection → infection scars.</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Autosomal Dominant PKD (ADPKD)</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>The most common inherited kidney disease (~1 in 500–1000); a whole-body ciliopathy that presents in adulthood.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Mutation in PKD1 (chr 16, polycystin-1, ~85%) or PKD2 (chr 4, polycystin-2). A somatic 'second hit' knocks out the good copy in scattered tubular cells, so they lose the ciliary calcium sensor, cAMP rises, and the cell proliferates and secretes fluid, ballooning into cysts that enlarge over decades into massive lumpy kidneys.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Flank pain, gross hematuria (cyst rupture), early hypertension, stones, and recurrent/infected cysts; extrarenal berry aneurysms (subarachnoid hemorrhage), hepatic cysts, mitral valve prolapse, and colonic diverticula.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>BP control (ACE inhibitor/ARB), tolvaptan to slow cyst growth, and MR angiography screening for cerebral aneurysm with a positive family history; ~50% reach ESRD by 60 (PKD1 earlier).</p></div>\n            </div>\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Autosomal Recessive PKD (ARPKD)</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>A rare infantile polycystic disease (~1 in 20,000) that is really a kidney-and-liver disease.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>PKHD1 mutation (chr 6, fibrocystin) affecting the collecting duct and biliary epithelium. Collecting ducts dilate into radial fusiform cysts, so kidneys are large but SMOOTH; the liver develops congenital hepatic fibrosis.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Bilateral flank masses at birth with oligohydramnios and the Potter sequence; survivors face renal failure plus portal hypertension from hepatic fibrosis.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Supportive; respiratory support at birth (pulmonary hypoplasia is the lethal problem in severe cases); manage renal failure and portal hypertension.</p></div>\n            </div>\n</div>\n<div class=\"ds-section-label\">Obstruction &amp; Stones</div>\n<div class=\"ds-grid\">\n<div class=\"ds-card\">\n              <h4 class=\"ds-name\">Urinary Tract Obstruction</h4>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Definition</span><p>Blockage anywhere from calyx to urethral meatus that raises back-pressure.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Mechanism</span><p>Causes vary by site and age: luminal stones; wall strictures/tumors; extrinsic BPH, pelvic tumors, or pregnancy; congenital posterior urethral valves (male infants) and ureteropelvic junction obstruction.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Clinical Clue</span><p>Two harms — back-pressure destroys nephrons (hydronephrosis) and stasis breeds stones and infection. Complete bilateral obstruction is an emergency.</p></div>\n              <div class=\"ds-row\"><span class=\"ds-tag\">Treatment</span><p>Find it, then fix it: image to localize, then relieve it (catheter, stent, nephrostomy, or surgery). Recoverable if relieved before permanent scarring.</p></div>\n            </div>\n</div>"};

/* ===================== Storage helpers ===================== */
const LS = {
  get(key, fallback){
    try{ const v = localStorage.getItem(key); return v===null? fallback : JSON.parse(v); }
    catch(e){ return fallback; }
  },
  set(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ /* storage full or unavailable */ }
  }
};

const CH_ORDER = ["27","28","30","31","33"];
const CH_TITLE = QBUNDLE.titles;
const CH_SHORT = QBUNDLE.short;
const CHAPTERS = QBUNDLE.chapters; // {27:[{num,stem,options,nb}], ...}

/* answer state: { "27-1": {status:'correct'|'wrong', chosen:'A', misses:0} } */
let answerState = LS.get('patho_answers_v1', {});
/* notes state: { "27": {text:'', images:[dataURL,...]} } */
let notesState = LS.get('patho_notes_v1', {});
/* time-per-chapter (minutes, float) */
let timeState = LS.get('patho_time_v1', {});

function saveAnswers(){ LS.set('patho_answers_v1', answerState); }
function saveNotes(){ LS.set('patho_notes_v1', notesState); }
function saveTime(){ LS.set('patho_time_v1', timeState); }

];

})();

/* ===================== Tabs ===================== */
const TAB_LIST = [...CH_ORDER.map(ch=>({id:'ch'+ch, label:CH_SHORT[ch]})), {id:'weak', label:'Weak Topics'}];
const tabbar = document.getElementById('tabbar');
const panels = document.getElementById('panels');
let activeTab = LS.get('patho_active_tab', 'ch27');

TAB_LIST.forEach(t=>{
  const b = document.createElement('button');
  b.textContent = t.label;
  b.dataset.tab = t.id;
  b.addEventListener('click', ()=> switchTab(t.id));
  tabbar.appendChild(b);
});

function switchTab(id){
  activeTab = id;
  LS.set('patho_active_tab', id);
  [...tabbar.children].forEach(b=> b.classList.toggle('active', b.dataset.tab===id));
  [...panels.children].forEach(p=> p.classList.toggle('active', p.id==='panel-'+id));
  updatePomoChapterLabel();
  updateStats();
}

/* ===================== Build chapter panels ===================== */
function qKey(ch, num){ return ch+'-'+num; }

function renderOptionsHTML(ch, q){
  return q.options.map(o=>{
    return `<button class="opt-btn" data-letter="${o.letter}">
      <span class="lt">${o.letter}.</span>${escapeHtml(o.text)}
      <div class="opt-expl" style="display:none;"></div>
    </button>`;
  }).join('');
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildChapterPanel(ch){
  const panel = document.createElement('div');
  panel.className = 'tab-panel';
  panel.id = 'panel-ch'+ch;

  const questions = CHAPTERS[ch];

  panel.innerHTML = `
    <div class="card">
      <button class="btn ghost ds-toggle" data-ch="${ch}">Show Disease Summary — ${CH_TITLE[ch]}</button>
      <div class="ds-wrap" id="dswrap-${ch}">${DS_BLOCKS[ch]}</div>
    </div>

    <div class="card">
      <h3>Notes &amp; Pasted Images — ${CH_SHORT[ch]}</h3>
      <div class="notes-grid">
        <div class="notes-box">
          <label>Notes</label>
          <textarea id="notes-text-${ch}" placeholder="Jot anything here — mnemonics, things to ask Professor Morgan, stuff you keep missing..."></textarea>
        </div>
        <div>
          <label>Paste or drop images here (screenshots, diagrams)</label>
          <div class="paste-zone" id="paste-zone-${ch}" tabindex="0">
            <div class="hint">Click here, then Ctrl/Cmd+V to paste a screenshot — or drag an image file in</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>${CH_TITLE[ch]} — Question Review</h3>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="progfill-${ch}"></div></div>
        <div class="progress-label" id="proglabel-${ch}"></div>
      </div>
      <div class="quiz-toolbar">
        <button class="filter-chip active" data-filter="all" data-ch="${ch}">All (${questions.length})</button>
        <button class="filter-chip" data-filter="unanswered" data-ch="${ch}">Unanswered</button>
        <button class="filter-chip" data-filter="wrong" data-ch="${ch}">Missed</button>
        <button class="filter-chip" data-filter="correct" data-ch="${ch}">Correct</button>
        <button class="btn ghost" id="reset-ch-${ch}" style="margin-left:auto;padding:6px 12px;">Reset this chapter</button>
      </div>
      <div id="qlist-${ch}"></div>
    </div>
  `;
  panels.appendChild(panel);

  // disease summary toggle
  panel.querySelector('.ds-toggle').addEventListener('click', (e)=>{
    const wrap = document.getElementById('dswrap-'+ch);
    const open = wrap.classList.toggle('open');
    e.target.textContent = (open? 'Hide Disease Summary — ' : 'Show Disease Summary — ') + CH_TITLE[ch];
  });

  // notes
  const ntKey = ch;
  notesState[ntKey] = notesState[ntKey] || {text:'', images:[]};
  const ta = panel.querySelector(`#notes-text-${ch}`);
  ta.value = notesState[ntKey].text || '';
  ta.addEventListener('input', ()=>{ notesState[ntKey].text = ta.value; saveNotes(); });

  const pasteZone = panel.querySelector(`#paste-zone-${ch}`);
  renderPasteZone(ch);
  pasteZone.addEventListener('paste', (e)=> handlePaste(e, ch));
  pasteZone.addEventListener('dragover', (e)=>{ e.preventDefault(); pasteZone.classList.add('dragover'); });
  pasteZone.addEventListener('dragleave', ()=> pasteZone.classList.remove('dragover'));
  pasteZone.addEventListener('drop', (e)=>{
    e.preventDefault(); pasteZone.classList.remove('dragover');
    const files = e.dataTransfer.files;
    for(const f of files){ if(f.type.startsWith('image/')) addImageFile(ch, f); }
  });

  // filter chips
  panel.querySelectorAll('.filter-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      panel.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      renderQuestionList(ch, chip.dataset.filter);
    });
  });

  panel.querySelector(`#reset-ch-${ch}`).addEventListener('click', ()=>{
    if(!confirm('Reset all answers for '+CH_SHORT[ch]+'? This clears correct/wrong tracking for this chapter only.')) return;
    questions.forEach(q=> delete answerState[qKey(ch,q.num)]);
    saveAnswers();
    renderQuestionList(ch, 'all');
    updateStats();
  });

  renderQuestionList(ch, 'all');
}

/* ===================== Image paste ===================== */
function handlePaste(e, ch){
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const item of items){
    if(item.type.startsWith('image/')){
      const file = item.getAsFile();
      addImageFile(ch, file);
    }
  }
}
function addImageFile(ch, file){
  const reader = new FileReader();
  reader.onload = function(ev){
    notesState[ch] = notesState[ch] || {text:'', images:[]};
    notesState[ch].images.push(ev.target.result);
    saveNotes();
    renderPasteZone(ch);
  };
  reader.readAsDataURL(file);
}
function renderPasteZone(ch){
  const zone = document.getElementById('paste-zone-'+ch);
  if(!zone) return;
  const imgs = (notesState[ch] && notesState[ch].images) || [];
  if(imgs.length===0){
    zone.innerHTML = `<div class="hint">Click here, then Ctrl/Cmd+V to paste a screenshot — or drag an image file in</div>`;
    return;
  }
  zone.innerHTML = imgs.map((src,i)=>`<div class="paste-thumb"><img src="${src}"><button class="rm" data-i="${i}">×</button></div>`).join('');
  zone.querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const i = +btn.dataset.i;
      notesState[ch].images.splice(i,1);
      saveNotes();
      renderPasteZone(ch);
    });
  });
}

/* ===================== Question list rendering ===================== */
function renderQuestionList(ch, filter){
  const listEl = document.getElementById('qlist-'+ch);
  const questions = CHAPTERS[ch];
  listEl.innerHTML = '';
  let answered=0, correct=0;
  questions.forEach(q=>{
    const key = qKey(ch, q.num);
    const st = answerState[key];
    if(st) answered++;
    if(st && st.status==='correct') correct++;
  });
  document.getElementById('progfill-'+ch).style.width = (questions.length? (answered/questions.length*100) : 0) + '%';
  document.getElementById('proglabel-'+ch).textContent = `${answered} / ${questions.length} answered · ${questions.length-answered} remaining`;

  questions.forEach(q=>{
    const key = qKey(ch, q.num);
    const st = answerState[key];
    if(filter==='unanswered' && st) return;
    if(filter==='wrong' && !(st && st.status==='wrong')) return;
    if(filter==='correct' && !(st && st.status==='correct')) return;

    const item = document.createElement('div');
    item.className = 'qitem';
    const numClass = st? (st.status==='correct'?'correct':'wrong') : '';
    const statusTxt = st? (st.status==='correct'?'✓ correct':'✗ missed'+(st.misses>1?` ×${st.misses}`:'')) : 'unanswered';
    item.innerHTML = `
      <div class="qitem-head" data-key="${key}">
        <div class="qitem-num ${numClass}">${q.num}</div>
        <div class="qitem-stem">${escapeHtml(q.stem)}</div>
        <div class="qitem-status">${statusTxt}</div>
      </div>
      <div class="qitem-body" id="body-${ch}-${q.num}">
        <div class="opts" data-ch="${ch}" data-num="${q.num}">
          ${renderOptionsHTML(ch,q)}
        </div>
        <div class="qitem-nb" style="display:none;">${escapeHtml(q.nb||'')}</div>
      </div>
    `;
    listEl.appendChild(item);

    item.querySelector('.qitem-head').addEventListener('click', ()=>{
      const body = item.querySelector('.qitem-body');
      body.classList.toggle('open');
    });

    // if already answered, render locked state
    if(st){
      lockQuestionUI(item, ch, q, st.chosen);
    }

    item.querySelectorAll('.opt-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        if(btn.classList.contains('disabled')) return;
        answerQuestion(ch, q, btn.dataset.letter, item);
      });
    });
  });
}

function answerQuestion(ch, q, letter, item){
  const key = qKey(ch, q.num);
  const correctOpt = q.options.find(o=>o.correct);
  const isCorrect = (letter === correctOpt.letter);
  const prev = answerState[key];
  const misses = (prev && prev.misses) ? prev.misses : 0;
  answerState[key] = { status: isCorrect?'correct':'wrong', chosen:letter, misses: isCorrect? misses : misses+1 };
  saveAnswers();
  lockQuestionUI(item, ch, q, letter);
  const numEl = item.querySelector('.qitem-num');
  numEl.classList.remove('correct','wrong');
  numEl.classList.add(isCorrect?'correct':'wrong');
  item.querySelector('.qitem-status').textContent = isCorrect? '✓ correct' : ('✗ missed'+((answerState[key].misses>1)?` ×${answerState[key].misses}`:''));
  updateStats();
}

function lockQuestionUI(item, ch, q, chosenLetter){
  const correctOpt = q.options.find(o=>o.correct);
  const nbDiv = item.querySelector('.qitem-nb');
  if(nbDiv) nbDiv.style.display = 'block';
  const verdictExists = item.querySelector('.qitem-verdict');
  if(!verdictExists){
    const isCorrect = chosenLetter === correctOpt.letter;
    const v = document.createElement('div');
    v.className = 'qitem-verdict ' + (isCorrect?'correct':'wrong');
    v.textContent = isCorrect? 'You had it — correct.' : `Not this time — correct answer is ${correctOpt.letter}.`;
    item.querySelector('.opts').before(v);
  }
  item.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.classList.add('disabled');
    const letter = btn.dataset.letter;
    const opt = q.options.find(o=>o.letter===letter);
    const explDiv = btn.querySelector('.opt-expl');
    explDiv.style.display = 'block';
    explDiv.textContent = (opt.correct? '✓ ' : '✗ ') + opt.expl;
    if(opt.correct) btn.classList.add('reveal-correct');
    if(letter===chosenLetter && !opt.correct) btn.classList.add('pick-wrong');
    if(letter===chosenLetter && opt.correct) btn.classList.add('pick-correct');
  });
}

/* ===================== Weak Topics tab ===================== */
function buildWeakPanel(){
  const panel = document.createElement('div');
  panel.className = 'tab-panel';
  panel.id = 'panel-weak';
  panel.innerHTML = `
    <div class="card">
      <h3>Weak Topics — everything you've ever missed</h3>
      <p style="font-size:12.5px;color:var(--dark1);margin:0 0 10px;">These pull from every chapter, most-missed first. Re-answer them here; once you get one right it drops in priority but stays in this list so you can keep hammering it.</p>
      <button class="btn ghost" id="clearWeakBtn">Clear all wrong-answer history</button>
    </div>
    <div id="weakList"></div>
  `;
  panels.appendChild(panel);
  panel.querySelector('#clearWeakBtn').addEventListener('click', ()=>{
    if(!confirm('Clear ALL wrong-answer tracking across every chapter? Correct answers stay recorded.')) return;
    Object.keys(answerState).forEach(k=>{
      if(answerState[k].status==='wrong') delete answerState[k];
    });
    saveAnswers();
    renderWeakList();
    updateStats();
  });
  renderWeakList();
}

function renderWeakList(){
  const listEl = document.getElementById('weakList');
  if(!listEl) return;
  listEl.innerHTML = '';
  // gather wrong entries grouped by chapter, sorted by misses desc
  let entries = [];
  CH_ORDER.forEach(ch=>{
    CHAPTERS[ch].forEach(q=>{
      const st = answerState[qKey(ch,q.num)];
      if(st && st.status==='wrong'){
        entries.push({ch, q, misses: st.misses||1, chosen: st.chosen});
      }
    });
  });
  if(entries.length===0){
    listEl.innerHTML = `<div class="card"><p style="font-size:13px;color:var(--dark1);">No missed questions right now — nice. Keep working through the chapters and anything you get wrong will show up here automatically.</p></div>`;
    return;
  }
  entries.sort((a,b)=> b.misses - a.misses);
  const grouped = {};
  entries.forEach(e=>{ grouped[e.ch] = grouped[e.ch]||[]; grouped[e.ch].push(e); });

  CH_ORDER.forEach(ch=>{
    if(!grouped[ch]) return;
    const label = document.createElement('div');
    label.className = 'weak-chapter-label';
    label.textContent = CH_TITLE[ch] + ` (${grouped[ch].length} missed)`;
    listEl.appendChild(label);
    const card = document.createElement('div');
    card.className='card';
    card.id = 'weakcard-'+ch;
    listEl.appendChild(card);
    grouped[ch].forEach(({q, misses})=>{
      const key = qKey(ch,q.num);
      const item = document.createElement('div');
      item.className='qitem';
      item.innerHTML = `
        <div class="qitem-head" data-key="${key}">
          <div class="qitem-num wrong">${q.num}</div>
          <div class="qitem-stem">${escapeHtml(q.stem)}</div>
          <div class="qitem-status">missed ×${misses}</div>
        </div>
        <div class="qitem-body">
          <div class="opts" data-ch="${ch}" data-num="${q.num}">
            ${renderOptionsHTML(ch,q)}
          </div>
          <div class="qitem-nb" style="display:none;">${escapeHtml(q.nb||'')}</div>
        </div>
      `;
      card.appendChild(item);
      item.querySelector('.qitem-head').addEventListener('click', ()=>{
        item.querySelector('.qitem-body').classList.toggle('open');
      });
      item.querySelectorAll('.opt-btn').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          if(btn.classList.contains('disabled')) return;
          const correctOpt = q.options.find(o=>o.correct);
          const isCorrect = btn.dataset.letter===correctOpt.letter;
          const prevMisses = (answerState[key]&&answerState[key].misses)||1;
          answerState[key] = {status: isCorrect?'correct':'wrong', chosen:btn.dataset.letter, misses: isCorrect?prevMisses:prevMisses+1};
          saveAnswers();
          lockQuestionUI(item, ch, q, btn.dataset.letter);
          item.querySelector('.qitem-status').textContent = isCorrect? '✓ fixed!' : `missed ×${answerState[key].misses}`;
          updateStats();
        });
      });
    });
  });
}

/* ===================== Stats ===================== */
function updateStats(){
  let answered=0, correct=0, wrong=0;
  Object.values(answerState).forEach(st=>{
    answered++;
    if(st.status==='correct') correct++; else wrong++;
  });
  document.getElementById('statAnswered').textContent = answered;
  document.getElementById('statRemaining').textContent = (TOTAL_Q - answered);
  document.getElementById('statAccuracy').textContent = answered? Math.round(correct/answered*100)+'%' : '—';
  document.getElementById('statWeak').textContent = wrong;
  // refresh any visible list's counts
  CH_ORDER.forEach(ch=>{
    const label = document.getElementById('proglabel-'+ch);
    if(label){
      const qs = CHAPTERS[ch];
      let a=0;
      qs.forEach(q=>{ if(answerState[qKey(ch,q.num)]) a++; });
      document.getElementById('progfill-'+ch).style.width = (a/qs.length*100)+'%';
      label.textContent = `${a} / ${qs.length} answered · ${qs.length-a} remaining`;
    }
  });
}

/* ===================== Pomodoro ===================== */
let pomoLen = 25*60, pomoLeft = 25*60, pomoRunning=false, pomoInterval=null, pomoIsBreak=false;
const pomoMinEl = document.getElementById('pomoMin');
const pomoSecEl = document.getElementById('pomoSec');
const pomoStartBtn = document.getElementById('pomoStartBtn');

document.querySelectorAll('.pomo-btns button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.pomo-btns button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    pomoLen = (+btn.dataset.len)*60;
    pomoLeft = pomoLen;
    pomoIsBreak = !!btn.dataset.break;
    renderPomo();
    stopPomo();
  });
});

function renderPomo(){
  const m = Math.floor(pomoLeft/60), s = pomoLeft%60;
  pomoMinEl.textContent = String(m).padStart(2,'0');
  pomoSecEl.textContent = String(s).padStart(2,'0');
}
function startPomo(){
  pomoRunning = true;
  pomoStartBtn.textContent = 'Pause';
  const chAtStart = activeTab.startsWith('ch')? activeTab.slice(2) : null;
  pomoInterval = setInterval(()=>{
    pomoLeft--;
    if(!pomoIsBreak && chAtStart){
      timeState[chAtStart] = (timeState[chAtStart]||0) + (1/60);
      timeState._all = (timeState._all||0) + (1/60);
      if(Math.random()<0.05) saveTime(); // periodic save, not every tick
    }
    renderPomo();
    updatePomoChapterLabel();
    if(pomoLeft<=0){
      stopPomo();
      saveTime();
      alert(pomoIsBreak? "Break's over — back at it. You've got this." : "Pomodoro done! Stretch, drink some water, then come back.");
    }
  },1000);
}
function stopPomo(){
  pomoRunning = false;
  pomoStartBtn.textContent = 'Start';
  clearInterval(pomoInterval);
  saveTime();
}
pomoStartBtn.addEventListener('click', ()=>{
  if(pomoRunning) stopPomo(); else startPomo();
});
document.getElementById('pomoResetBtn').addEventListener('click', ()=>{
  stopPomo();
  pomoLeft = pomoLen;
  renderPomo();
});

function updatePomoChapterLabel(){
  const chLbl = document.getElementById('pomoChLabel');
  const chTime = document.getElementById('pomoChTime');
  const allTime = document.getElementById('pomoAllTime');
  if(activeTab.startsWith('ch')){
    const ch = activeTab.slice(2);
    chLbl.textContent = CH_SHORT[ch];
    chTime.textContent = fmtMin(timeState[ch]||0);
  } else {
    chLbl.textContent = 'Weak Topics review';
    chTime.textContent = fmtMin(0);
  }
  allTime.textContent = fmtMin(timeState._all||0);
}
function fmtMin(mins){
  const total = Math.round(mins);
  const h = Math.floor(total/60), m = total%60;
  return h>0? `${h}h ${m}m` : `${m}m`;
}

/* ===================== Init ===================== */
const TOTAL_Q = CH_ORDER.reduce((sum,ch)=> sum + CHAPTERS[ch].length, 0);
document.getElementById('statRemaining').textContent = TOTAL_Q;

CH_ORDER.forEach(ch=> buildChapterPanel(ch));
buildWeakPanel();
renderPomo();
switchTab(activeTab);
updateStats();

window.addEventListener('beforeunload', ()=>{ saveTime(); saveAnswers(); saveNotes(); });

</script>
